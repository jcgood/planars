# planars' command operation registry -- Phase 4 of the data layer plan
# (issue #271, "Topology declaration"). One record per entry in
# coding/__main__.py's _COMMANDS table: side effects, idempotency,
# preconditions, which facts.yaml facts the command touches and how, what it
# triggers downstream, and required ordering relative to other commands. See
# SCHEMA.md.
#
# DRAFT, not yet reviewed. The plan requires the coordinator to review two
# things specifically before this phase is done: every authority assignment
# (does facts_touched/preconditions actually match reality) and every
# idempotency claim (a false "true" here is load-bearing -- Phases 7 and 8
# build recovery logic on top of it). Until that review, treat this file as a
# first pass, not ground truth. Drafted 2026-08-10, grounded in CLAUDE.md,
# coding/CLAUDE.md, and facts.yaml/preconditions.yaml's own cascade/
# drift_risk/required_by text rather than fresh guesses -- see each record's
# ordering_constraints and facts_touched for what's already independently
# documented elsewhere vs. new synthesis.

- id: capture_drive_state
  cli_command: capture-drive-state
  description: >-
    Records live Drive/Sheets state (every annotation spreadsheet plus the
    manifest) to tests/fixtures/drive_state/, for the offline fake Drive
    backend used by every other command's tests.
  side_effects:
    - "overwrites tests/fixtures/drive_state/{lang}/*.json and manifest.json"
  idempotent: true
  idempotency_note: >-
    Always re-records current live state; running it twice with nothing
    changed on Drive in between produces byte-identical fixture files.
  apply_gate: "--apply"
  preconditions: []
  facts_touched:
    - {fact: drive_state_test_fixtures, role: writes}
  cascades_triggered: []
  ordering_constraints:
    - >-
      Read-only against Drive -- the only live Drive call permitted before
      Phase 9 of the data layer plan (issue #271). That constraint is scoped
      to the migration's own throwaway test harness, not to normal
      coordinator use of every other command.
  modes: []

- id: generate_sheets
  cli_command: generate-sheets
  description: >-
    Creates/updates Google Sheets annotation forms for every language's
    diagnostics classes. This record's top-level fields describe the base
    command (dry-run by default); --regen-construction and --regen-dependents
    are separate, always-live code paths with their own preconditions and
    facts, described under modes below.
  side_effects:
    - >-
      creates/updates the language's Drive folder, notes doc,
      planar/diagnostics reference sheets, one spreadsheet per class, Status
      tabs; writes sheets_manifest.json and drive_config.json
    - >-
      --force: overwrites planar/diagnostics reference sheets before
      checking whether annotation sheets already exist (Finding 15 in
      docs/data-layer-progress.md -- current behaviour, not yet fixed)
  idempotent: false
  idempotency_note: >-
    A true no-op --apply still re-uploads the merged manifest once at the end
    (documented test behaviour, not a bug), so a second run always produces
    at least one write.
  apply_gate: "--apply"
  preconditions: []
  facts_touched:
    - {fact: planar_sheet_structure, role: reads}
    - {fact: diagnostics_scope, role: reads}
    - {fact: manifest_class_registration, role: writes}
    - {fact: pair_row_construction_set, role: writes}
    - {fact: languages_metadata, role: writes}
  cascades_triggered:
    - "regenerate_notebooks() runs automatically after a successful --apply"
  ordering_constraints:
    - >-
      Run restructure-sheets --split-element or --rename-element before
      --regen-construction if the element was renamed or split, so the old
      annotated rows are already gone from the live sheet by the time
      --regen-construction runs; otherwise pass --confirm-drop to proceed
      anyway (issue #241).
    - >-
      For nonpermutability and coreference (two-stage pair constructions):
      annotate element_prescreening / prescreening and mark it
      ready-for-review before running --regen-construction CLASS:general (or
      a pair construction) -- running it earlier produces an unfiltered pair
      list.
    - >-
      Run lookup-lang before generate-sheets when onboarding a brand-new
      language, so schemas/languages.yaml already has Glottolog metadata
      cached.
  modes:
    - name: "--regen-construction"
      description: >-
        Overwrites one construction's live tab immediately, regenerating it
        from the current diagnostics YAML/planar structure.
      side_effects:
        - "overwrites CLASS:CONSTRUCTION's live tab immediately, no --apply gate"
        - >-
          aborts instead of writing if it would silently drop an annotated
          pair-row (issue #241), unless --confirm-drop is passed
      idempotent: false
      idempotency_note: >-
        Overwrites the live tab every time it runs, by design -- not safe to
        assume a second run is a no-op if annotation happened in between;
        guarded by the annotated-drop check (#241), not by idempotency.
      apply_gate: null
      preconditions: []
      facts_touched:
        - {fact: pair_row_construction_set, role: writes}
        - {fact: dependent_construction_element_scope, role: writes}
        - {fact: pair_row_position_numbers, role: writes}
    - name: "--regen-dependents"
      description: >-
        Regenerates a dependent pair-row tab (e.g. nonpermutability's general
        from element_prescreening) only when it doesn't exist yet -- never
        overwrites one with existing content.
      side_effects:
        - >-
          creates a missing dependent pair-row tab from its prescreening
          source; does nothing if the tab already exists, with or without
          content
      idempotent: true
      idempotency_note: >-
        Only ever creates a tab that doesn't exist yet -- once created, a
        second run finds nothing left to do and makes no further writes.
      apply_gate: null
      preconditions: [coded_data_clean_tree]
      facts_touched:
        - {fact: dependent_construction_element_scope, role: writes}

- id: generate_notebooks
  cli_command: generate-notebooks
  description: >-
    Generates and uploads per-language contributor/validation/report
    notebooks plus the coordinator notebook.
  side_effects:
    - >-
      create-or-update uploads to Drive (renamed on update), shared "anyone
      with the link, reader" on every run via drive.create_or_update_shared_file
  idempotent: true
  idempotency_note: >-
    ensure_anyone_permission checks for an existing grant before creating one
    (fixed issue #276 -- before that, every run silently added a duplicate
    "anyone" permission). A repeat run with no content change re-uploads the
    same content and re-asserts the same single grant.
  apply_gate: "--apply"
  preconditions: []
  facts_touched: []
  cascades_triggered: []
  ordering_constraints:
    - >-
      Runs automatically after generate-sheets --apply, sync-params --apply,
      and restructure-sheets --apply -- not normally invoked directly by a
      coordinator.
  modes: []

- id: generate_reports
  cli_command: generate-reports
  description: >-
    Generates and uploads report_{lang_id}.pdf directly to Drive for every
    language (no Colab; run nightly by GitHub Actions).
  side_effects:
    - >-
      create-or-update uploads report_{lang_id}.pdf per language, shared
      "anyone with the link, reader" on every run
  idempotent: true
  idempotency_note: >-
    Same ensure_anyone_permission-based idempotency as generate-notebooks,
    fixed under the same issue #276 -- before the fix, a manually-revoked
    report share was never restored, since the grant was only asserted on
    create, not on every run.
  apply_gate: "--apply"
  preconditions: []
  facts_touched: []
  cascades_triggered: []
  ordering_constraints: []
  modes: []

- id: sync_params
  cli_command: sync-params
  description: >-
    Syncs a construction's criterion columns on its live sheet when
    diagnostics_{lang_id}.yaml changes (rename, split, merge, remove);
    regenerates the diagnostics YAML afterward.
  side_effects:
    - "inserts/deletes/renames criterion columns on live annotation tabs"
    - "updates sheets_manifest.json's per-construction param_names and param_values"
  idempotent: true
  idempotency_note: >-
    Retry-safe: every sheet edit is driven by a real diff between the tab's
    own actual header and the current diagnostics YAML (never the manifest),
    so a crash mid-run leaves already-updated tabs correctly matching the
    YAML, and a retry finds nothing left to do for them. The manifest
    upload (upload_manifest) is deferred to the end of the whole run like
    import-sheets' pending_changes.json and prune-manifest's manifest write,
    but unlike those two this is not a data-loss or reprocessing risk: the
    same code path that checks "does the sheet match the YAML" separately
    checks "does the manifest's param_names match the YAML" (line ~679,
    "Sync param_names in manifest if needed"), so the next successful run
    catches the manifest up regardless of what a previous crash left
    unfinished. param_values is only ever updated for the criteria a given
    run actually touched (Finding 14's fix), not blindly overwritten. Not
    safe against a concurrent edit to the same tab by another actor while
    this command is running -- a different, non-retry hazard.
  apply_gate: "--apply"
  preconditions: [coded_data_clean_tree]
  facts_touched:
    - {fact: construction_criterion_columns, role: writes}
  cascades_triggered:
    - "regenerate_notebooks() runs automatically after --apply"
    - "regenerates diagnostics_{lang_id}.yaml to match the change"
  ordering_constraints:
    - >-
      Run after editing diagnostics_{lang_id}.yaml's criteria for a class
      whose sheets already exist -- this is the propagation step, not the
      edit itself.
  modes:
    - name: "--refresh-dropdowns"
      description: >-
        Pushes current YAML-derived allowed values to the live Sheet's
        dropdown validation, independent of any column rename/split/merge.
      side_effects:
        - "pushes current YAML-derived allowed values to live dropdown validation"
        - "updates sheets_manifest.json's param_values to match"
      idempotent: true
      idempotency_note: >-
        Reads fresh from the tab's own header and the current diagnostics
        YAML every run, never from the manifest -- a second run with nothing
        changed reasserts the same dropdown rules (same mechanism as the
        standalone refresh-dropdowns command, issue #272's fix).
      apply_gate: "--apply --refresh-dropdowns"
      preconditions: [coded_data_clean_tree]
      facts_touched:
        - {fact: manifest_dropdown_values, role: writes}

- id: sync_diagnostics_yaml
  cli_command: sync-diagnostics-yaml
  description: >-
    Syncs diagnostics_{lang_id}.yaml (source of truth) to the derived TSV.
    This record's top-level fields describe that default YAML->TSV
    direction; --to-sheet and --from-tsv are different directions entirely,
    described under modes below.
  side_effects:
    - "overwrites diagnostics_{lang_id}.tsv from the YAML"
  idempotent: true
  idempotency_note: >-
    Only writes when the derived TSV content actually differs from what's on
    disk ("TSV already up to date" short-circuits otherwise) -- a second run
    with nothing changed performs no write.
  apply_gate: "--apply"
  preconditions: []
  facts_touched:
    - {fact: diagnostics_scope, role: both}
  cascades_triggered: []
  ordering_constraints:
    - >-
      A required class (collection_required: "y" in
      diagnostic_classes_status.yaml) missing from a language's YAML no
      longer blocks this default direction from regenerating the TSV for the
      classes that ARE present (Finding 20 in docs/data-layer-progress.md)
      -- it still blocks --to-sheet, since pushing an incomplete language's
      diagnostics to the live Sheet is a more consequential action than a
      local file regeneration.
    - >-
      Run --to-sheet after renaming a class or criterion in the YAML, so the
      Sheet stays in sync and import-sheets stops reporting false drift.
  modes:
    - name: "--to-sheet"
      description: >-
        Pushes the YAML-derived diagnostics content to the live diagnostics
        Sheet, overwriting stale content.
      side_effects:
        - "overwrites the live diagnostics Sheet's content from the YAML"
      idempotent: true
      idempotency_note: >-
        Only writes when content differs from the Sheet's current content
        ("Sheet already up to date" short-circuits otherwise).
      apply_gate: "--to-sheet --apply"
      preconditions: []
      facts_touched:
        - {fact: diagnostics_scope, role: both}
    - name: "--from-tsv"
      description: >-
        Diffs the TSV against the YAML; deterministic differences are
        auto-applied to the YAML, ambiguous ones go to diagnostics_drift.json
        for coordinator review.
      side_effects:
        - "--apply: writes deterministic TSV->YAML changes into the YAML"
        - "always writes ambiguous changes to diagnostics_drift.json, regardless of --apply"
      idempotent: true
      idempotency_note: >-
        Diffs current TSV against current YAML fresh each run; with nothing
        changed on either side, produces no YAML changes and an empty drift
        file.
      apply_gate: "--from-tsv --apply"
      preconditions: []
      facts_touched:
        - {fact: diagnostics_scope, role: both}

- id: sync_qualification_hashes
  cli_command: sync-qualification-hashes
  description: >-
    Stamps qualification_rule_hash in diagnostic_classes_status.yaml after a
    module's qualification-rule prose has been reviewed and its
    docstring/comments updated to match.
  side_effects:
    - "writes a fresh qualification_rule_hash for the class(es) being stamped"
  idempotent: true
  idempotency_note: "Re-running with nothing changed re-derives and writes the same hash value."
  apply_gate: "--apply"
  preconditions: []
  facts_touched:
    - {fact: qualification_rule_semantics, role: writes}
  cascades_triggered: []
  ordering_constraints:
    - >-
      The last step of the qualification-rule update workflow: edit
      diagnostic_classes.yaml -> CI detects the hash mismatch ->
      generate-rule-update-prompt produces a Claude prompt -> the module's
      docstring/comments are updated and reviewed -> sync-qualification-hashes
      --apply re-stamps the hash. Running this before the docstring update
      makes check-codebook stop flagging a change that hasn't actually been
      reviewed yet.
  modes: []

- id: update_sheets
  cli_command: update-sheets
  description: >-
    Adds missing rows/trailing columns to existing sheets and creates tabs
    for constructions newly added to the diagnostics YAML; ensures the
    Status tab exists and is last.
  side_effects:
    - "appends rows/columns to live annotation tabs"
    - "creates new construction tabs for constructions not yet in the manifest"
    - "updates sheets_manifest.json"
  idempotent: true
  idempotency_note: >-
    Which columns/rows are missing is derived from the tab's own header plus
    the current diagnostics YAML (never the manifest) every run -- a second
    run with nothing changed adds nothing further. Before this design
    (Findings 9-11 in docs/data-layer-progress.md), appending one row could
    narrow a whole tab's dropdowns or write NA into Source/Comments; those
    were bugs in what got written, not in whether re-running was safe.
  apply_gate: "--apply"
  preconditions: [coded_data_clean_tree]
  facts_touched:
    - {fact: manifest_class_registration, role: writes}
    - {fact: pair_row_construction_set, role: reads}
  cascades_triggered: []
  ordering_constraints: []
  modes: []

- id: import_sheets
  cli_command: import-sheets
  description: >-
    Downloads filled annotation sheets to local TSVs; auto-applies safe
    downstream commands; writes destructive changes to pending_changes.json
    instead of applying them directly.
  side_effects:
    - "overwrites coded_data/{lang}/{class}/{construction}.tsv from the live sheet, incrementally per tab"
    - "writes pending_changes.json for ready-for-review tabs' destructive changes"
    - "paints pink highlighting on invalid cells (all tabs, any status)"
    - >-
      does NOT auto-commit coded_data/ -- prints the git add/commit/push
      commands for the coordinator to run by hand (only import_planar.py and
      restructure_sheets.py call drive._autocommit_data(); import_sheets.py
      does not, corrected 2026-08-11 -- an earlier version of this record
      claimed otherwise)
  idempotent: false
  idempotency_note: >-
    Re-running with nothing changed on the live sheets since the last run
    produces no new TSV content and no new pending changes, which is safe.
    But pending_changes.json is only written once
    (_append_pending_changes(all_pending) at the end of main(), after every
    tab has been processed), while each tab's TSV is written incrementally
    as it's processed. If the run crashes after a tab's TSV write but before
    that final write, that tab's destructive-change record is silently lost,
    not just delayed: a retry re-downloads the same (now-unchanged) tab,
    finds its local TSV already matches, and never re-detects the change
    that would have gone to pending_changes.json. --ignore-status also
    changes what counts as "ready-for-review" between runs, so the same live
    state can produce different output depending on the flag. Filed as
    issue #280 (batched-write-at-end-of-loop, same root cause shared with
    prune-manifest and apply-pending).
  apply_gate: "--apply"
  preconditions: [coded_data_clean_tree]
  facts_touched:
    - {fact: pair_row_construction_set, role: reads}
    - {fact: pair_row_position_numbers, role: reads}
    - {fact: diagnostics_scope, role: reads}
  cascades_triggered:
    - "auto-applies safe downstream commands after a successful run"
    - "revalidates sheets after auto-apply"
  ordering_constraints:
    - >-
      A required class missing from a language's diagnostics YAML
      (collection_required: "y") makes this command skip that language's
      diagnostics validation entirely until resolved (Finding 19 in
      docs/data-layer-progress.md).
    - >-
      apply-pending reviews what this command writes to pending_changes.json
      -- run import-sheets before apply-pending has anything to review.
  modes: []

- id: validate_coding
  cli_command: validate-coding
  description: >-
    Re-validates annotation sheets against the diagnostics YAML's allowed
    values and updates pink cell highlighting; exits non-zero on errors
    (used by the sheet-validation workflow).
  side_effects:
    - "updates highlight_cells/clear_highlights on live tabs to reflect current validation state"
  idempotent: true
  idempotency_note: >-
    Highlighting is recomputed from current sheet content and the current
    diagnostics YAML every run, not accumulated -- a repeat run with nothing
    changed re-paints the same cells the same colours.
  apply_gate: null
  preconditions: []
  facts_touched:
    - {fact: pair_row_construction_set, role: reads}
    - {fact: diagnostics_scope, role: reads}
  cascades_triggered: []
  ordering_constraints:
    - >-
      If a tab's header doesn't match its construction's declared row_type,
      this command checks nothing else in that tab and names both the
      --regen-construction fix and the schema field to change instead -- see
      pair_row_construction_set in facts.yaml.
  modes: []

- id: validation_report
  cli_command: validation-report
  description: >-
    Turns validate-coding's output into a GitHub issue body for the
    sheet-validation workflow; pure formatting, no live Sheet/gh calls of
    its own.
  side_effects:
    - "none directly (writes stdout only; the gh calls live in the calling workflow, not this command)"
  idempotent: true
  idempotency_note: "Pure function of validate-coding's log text -- same input always produces the same formatted output."
  apply_gate: null
  preconditions: []
  facts_touched: []
  cascades_triggered: []
  ordering_constraints:
    - "Run after validate-coding, on its output -- this command has no Drive access of its own."
  modes: []

- id: restructure_sheets
  cli_command: restructure-sheets
  description: >-
    Archives and regenerates sheets after structural changes to the planar
    (--rename-map, --rename-element, --split-element, --rename-class).
  side_effects:
    - "archives the old sheet, creates/regenerates the new one, carries annotations over"
    - >-
      edits planar_{lang_id}.tsv directly for structural flags; pushes it
      back to the live planar Sheet via import-planar --to-sheet
    - "--rename-class: renames the local TSV directory in place, updates the manifest"
    - "notifies the language's tracking issue via notify.py after sheets actually change"
    - "auto-commits coded_data/ changes"
  idempotent: false
  idempotency_note: >-
    Each run archives the current sheet and creates a new one -- running it
    twice with the same flags archives twice, not a no-op. No rollback
    exists if it fails partway through a multi-step change -- exactly the
    gap Phase 7 of the data layer plan is meant to close (see #248).
  apply_gate: "--apply"
  preconditions: [coded_data_clean_tree, coded_data_git_identity_configured]
  facts_touched:
    - {fact: planar_sheet_structure, role: writes}
    - {fact: sheet_change_notification_state, role: writes}
    - {fact: pair_row_position_numbers, role: writes}
  cascades_triggered:
    - "regenerate_notebooks() runs automatically after --apply"
    - >-
      push_planars_to_sheets() (import-planar --to-sheet) runs automatically
      after --apply so the master planar Sheet doesn't go stale
    - "notify.py posts to (or creates) the language's 'Sheet updates -- {lang_id}' GitHub issue"
  ordering_constraints:
    - >-
      --split-element cascades into every pair-row construction referencing
      the retired element, fanning old pairs into blank new rows per
      replacement -- but does NOT cascade a position NUMBER shift into
      pair-row Position_A/Position_B cells from an insertion/deletion
      elsewhere in the planar; that needs generate-sheets --regen-construction
      --pos-remap by hand (issue #241).
    - >-
      Never use prune-manifest for a rename -- it archives and discards
      rather than carrying annotations forward. Update
      diagnostics_{lang_id}.tsv to the new name first, then run
      restructure-sheets --rename-class OLD:NEW --apply.
    - >-
      This command never calls drive._check_coded_data_clean() despite
      reading planar_{lang_id}.tsv/diagnostics_{lang_id}.tsv as its source of
      truth -- a documented, still-open gap (Finding 17 in
      docs/data-layer-progress.md).
  modes: []

- id: check_codebook
  cli_command: check-codebook
  description: >-
    Checks consistency between diagnostic_criteria.yaml,
    diagnostic_classes.yaml/diagnostic_classes_status.yaml, analysis
    modules, and every diagnostics_{lang_id}.tsv.
  side_effects: ["none (read-only)"]
  idempotent: true
  idempotency_note: "Pure read-and-report; makes no writes of any kind."
  apply_gate: null
  preconditions: []
  facts_touched:
    - {fact: qualification_rule_semantics, role: reads}
    - {fact: diagnostics_scope, role: reads}
  cascades_triggered: []
  ordering_constraints:
    - >-
      Runs in CI on every push and daily via data-refresh.yml; a
      codebook-error issue is what tells a coordinator
      generate-rule-update-prompt has something to say.
  modes: []

- id: generate_rule_update_prompt
  cli_command: generate-rule-update-prompt
  description: >-
    Generates a coordinator-facing Claude prompt for each class with a
    missing or stale qualification_rule_hash; used to enrich the
    codebook-error issue body.
  side_effects: ["none directly (writes stdout / issue-body text only)"]
  idempotent: true
  idempotency_note: "Pure function of the current hash-mismatch state -- same input state produces the same prompt text."
  apply_gate: null
  preconditions: []
  facts_touched:
    - {fact: qualification_rule_semantics, role: reads}
  cascades_triggered: []
  ordering_constraints:
    - >-
      Sits between check-codebook detecting a stale hash and
      sync-qualification-hashes re-stamping it -- see
      sync_qualification_hashes' ordering_constraints for the full workflow.
  modes: []

- id: integrity_check
  cli_command: integrity-check
  description: >-
    Full project-wide health report across all languages and schemas;
    --sheets adds live Sheet structural validation; --lang restricts to one
    language.
  side_effects: ["none (read-only; --sheets still only reads, never writes)"]
  idempotent: true
  idempotency_note: "Pure read-and-report across every section; no writes anywhere in the file."
  apply_gate: null
  preconditions: []
  facts_touched:
    - {fact: manifest_class_registration, role: reads}
    - {fact: manifest_dropdown_values, role: reads}
    - {fact: construction_criterion_columns, role: reads}
    - {fact: pair_row_position_numbers, role: reads}
    - {fact: dependent_construction_element_scope, role: reads}
    - {fact: diagnostics_scope, role: reads}
  cascades_triggered: []
  ordering_constraints:
    - >-
      Run daily via data-refresh.yml; a missing required class
      (collection_required: "y") is reported here as an ERROR (Finding 19 in
      docs/data-layer-progress.md) and folds into the standing
      integrity-error issue rather than a dedicated label.
    - >-
      The construction_criterion_columns check (--sheets only) compares the
      live tab's header against the MANIFEST's cached param_names, not
      against diagnostics_{lang_id}.yaml directly -- it cannot detect a
      criterion column change in the YAML that sync-params was never run for
      at all (see construction_criterion_columns's drift_risk in
      facts.yaml).
  modes: []

- id: setup_root_folder
  cli_command: setup-root-folder
  description: "One-time creation of the ConstituencyTypology root Drive folder."
  side_effects:
    - "creates the root folder if it doesn't already exist; asserts the 'anyone with the link, reader' permission"
  idempotent: true
  idempotency_note: >-
    ensure_anyone_permission-based, same mechanism as generate-notebooks/
    generate-reports (issue #276) -- a second run with the folder already
    present and shared makes zero Drive calls at all.
  apply_gate: null
  preconditions: []
  facts_touched: []
  cascades_triggered: []
  ordering_constraints:
    - >-
      Run once, after the first generate-sheets --apply creates the first
      language folder to nest under it.
  modes: []

- id: lookup_lang
  cli_command: lookup-lang
  description: >-
    Fetches and caches Glottolog metadata (name, ISO 639-3, family,
    coordinates) for a Glottocode, writing it into glottolog_cache.json and
    schemas/languages.yaml.
  side_effects:
    - "writes glottolog_cache.json and updates the language's entry in schemas/languages.yaml"
  idempotent: true
  idempotency_note: >-
    Re-running for the same Glottocode re-fetches and overwrites with the
    same (or newly current) upstream data; --refresh forces a re-fetch, the
    default reads the cache when present.
  apply_gate: null
  preconditions: []
  facts_touched:
    - {fact: languages_metadata, role: writes}
  cascades_triggered: []
  ordering_constraints:
    - >-
      Run before generate-sheets when onboarding a new language, so
      schemas/languages.yaml already has Glottolog metadata cached rather
      than generate-sheets warning about it.
  modes: []

- id: apply_pending
  cli_command: apply-pending
  description: >-
    Interactive review and application of destructive changes recorded by
    import-sheets in pending_changes.json; closes the pending-changes issue
    when cleared.
  side_effects:
    - "applies coordinator-approved destructive changes to coded_data/ and/or the manifest; clears entries from pending_changes.json"
  idempotent: false
  idempotency_note: >-
    _save_pending(remaining) is called exactly once, after the for loop over
    every entry finishes -- not per entry. An entry is only dropped from
    `remaining` (and so from the next _save_pending write) after its
    underlying command has already run and returned rc == 0. If the process
    crashes after entry 3 of 10 succeeds but before the loop finishes, entry
    3's command already ran for real, but pending_changes.json still lists
    it: a retry re-runs entry 3's command a second time. Whether that's safe
    depends entirely on what the entry's command is (e.g. a
    generate-sheets --regen-construction entry is itself close to retry-safe
    per that record; other entry types were not individually checked here).
    This is the clearest of the three batched-write findings from this
    review pass (2026-08-11) -- the double-run risk is direct, not
    conditional on Drive API behavior the way prune-manifest's is. Filed as
    issue #280.
  apply_gate: "interactive (per-entry approval, not a single --apply flag)"
  preconditions: []
  facts_touched: []
  cascades_triggered: []
  ordering_constraints:
    - "Only has something to review after import-sheets --apply has written pending_changes.json."
  modes: []

- id: prune_manifest
  cli_command: prune-manifest
  description: >-
    Removes a retired class's entry from the Drive manifest, archives its
    local TSVs, and moves its Drive spreadsheet to _archived/; warns if the
    sheet was edited within 14 days.
  side_effects:
    - "moves coded_data/{lang}/{class}/ TSVs to coded_data/{lang}/archive/{class}/"
    - "moves the class's Drive spreadsheet to the _archived/ subfolder"
    - "removes the class's entry from sheets_manifest.json"
  idempotent: false
  idempotency_note: >-
    Which classes are stale (_find_stale) is recomputed fresh from the
    current manifest at the start of every run, so a class already fully
    pruned (manifest entry gone) correctly won't be reprocessed. But the
    Drive manifest write (upload_manifest) happens once, after the entire
    loop over every stale class finishes -- local TSVs are archived and the
    Drive sheet is moved to _archived/ per-class inside that loop, all
    before the manifest ever gets uploaded. A crash after class A's files
    are archived and its sheet moved, but before the loop finishes, leaves
    the Drive-side manifest still showing class A as present: a retry's
    _find_stale sees A as stale again and reprocesses it -- _tsv_paths finds
    nothing (already archived, handled gracefully) and _archive_drive_sheet
    re-attempts moving a spreadsheet already in _archived/, which is likely
    a harmless no-op at the Drive API level (re-parenting to an unchanged
    folder) but was not verified against a real repeat call while writing
    this record. Same batched-write-at-the-end shape as import-sheets'
    pending_changes.json and apply-pending's pending file, found in the same
    review pass (2026-08-11). Filed as issue #280.
  apply_gate: "--apply"
  preconditions: []
  facts_touched:
    - {fact: manifest_class_registration, role: writes}
  cascades_triggered: []
  ordering_constraints:
    - "For retiring a class: remove it from diagnostics_{lang_id}.tsv first, then run prune-manifest --apply."
    - >-
      Never use for a rename -- it discards rather than carries annotations
      forward. Use restructure-sheets --rename-class instead (see that
      record's ordering_constraints).
  modes: []

- id: check_notes
  cli_command: check-notes
  description: >-
    Checks collaborator notes Google Docs for new content since the last
    check and files/updates GitHub issues from it.
  side_effects:
    - "creates or comments on GitHub issues summarizing new notes content"
    - "appends an acknowledgment to the collaborator's notes doc"
    - "writes coded_data/notes_state.json (content-hash change-detection state)"
  idempotent: false
  idempotency_note: >-
    A fourth instance of the #280 batched-write pattern, found in the same
    review pass (2026-08-11): _save_notes_state(state) runs once, at the
    very end of main(), after every language has been checked, every
    annotator's GitHub issue has been filed/updated, and every
    acknowledgment has already been appended to its notes doc. The hash
    driving change detection is computed on the doc's content with
    acknowledgment lines stripped out (_strip_acknowledgment_lines), so
    appending the acknowledgment does not change it. If the process crashes
    after an acknowledgment is appended but before the final
    _save_notes_state call, notes_state.json still holds the OLD hash: a
    retry re-reads the same underlying content, computes the same "new"
    hash again, and re-files/comments on the issue and appends a second,
    duplicate acknowledgment line to the doc.
  apply_gate: "--apply"
  preconditions: [check_notes_documents_scope_authorized]
  facts_touched: []
  cascades_triggered: []
  ordering_constraints:
    - "Same batched-write-at-end-of-loop shape as issue #280 (import-sheets, apply-pending, prune-manifest)."
  modes: []

- id: refresh_dropdowns
  cli_command: refresh-dropdowns
  description: >-
    Refreshes criterion dropdown validation on existing sheets from the
    current diagnostics YAML, without touching annotation data.
  side_effects:
    - "updates dropdown validation rules on live tabs; updates sheets_manifest.json's param_values"
  idempotent: true
  idempotency_note: >-
    Criterion columns and their values are read fresh from the tab's own
    header and the diagnostics YAML every run (issue #272's fix), never from
    the manifest -- a second run with nothing changed reasserts the same
    dropdown rules.
  apply_gate: "--apply"
  preconditions: []
  facts_touched:
    - {fact: manifest_dropdown_values, role: writes}
  cascades_triggered: []
  ordering_constraints: []
  modes: []

- id: import_planar
  cli_command: import-planar
  description: >-
    Syncs planar_{lang_id}.tsv against the Drive planar spreadsheet. This
    record's top-level fields describe the default Sheet -> TSV (download)
    direction; --to-sheet is the reverse direction, described under modes
    below.
  side_effects:
    - >-
      archives the old planar_{lang_id}.tsv, overwrites it from the Sheet,
      writes PLANAR_CHANGES_PATH for the planar-changed issue body
    - "auto-commits coded_data/ changes"
  idempotent: true
  idempotency_note: >-
    Only writes when the content genuinely differs from what's on disk ("up
    to date" short-circuits otherwise) -- a second run with nothing changed
    performs no write.
  apply_gate: "--apply"
  preconditions: [coded_data_git_identity_configured]
  facts_touched:
    - {fact: planar_sheet_structure, role: both}
  cascades_triggered: []
  ordering_constraints:
    - >-
      --to-sheet runs automatically at the end of restructure-sheets --apply
      (via push_planars_to_sheets()) so a local structural edit never goes
      un-pushed -- the fix for the 2026-07-29 incident (#244/#245/#248). Any
      other script that edits planar_{lang_id}.tsv directly needs to call
      the same push, or the next scheduled default-direction import-planar
      --apply will silently revert it (see planar_sheet_structure's
      drift_risk in facts.yaml).
  modes:
    - name: "--to-sheet"
      description: "Reverse direction: pushes local planar_{lang_id}.tsv content up to the live planar Sheet."
      side_effects:
        - "overwrites the live planar Sheet's content from the local TSV"
      idempotent: true
      idempotency_note: >-
        Only writes when content genuinely differs from the Sheet's current
        content -- a second run with nothing changed makes no write.
      apply_gate: "--to-sheet --apply"
      preconditions: []
      facts_touched:
        - {fact: planar_sheet_structure, role: both}

- id: generate_status_sheet
  cli_command: generate-status-sheet
  description: >-
    Builds a locked, read-only status_{lang_id} spreadsheet per language
    showing per-construction completeness, in a freestanding top-level
    Annotation Status Drive folder.
  side_effects:
    - "creates or updates the status_{lang_id} spreadsheet; shares it read-only with the specialist"
  idempotent: true
  idempotency_note: >-
    Recomputes every construction's completeness fresh from current
    construction_tsv/annotation_sheet state on each run and overwrites the
    sheet -- a second run with nothing changed produces the same content.
  apply_gate: "--apply"
  preconditions: []
  facts_touched:
    - {fact: status_sheet_completeness, role: writes}
  cascades_triggered: []
  ordering_constraints:
    - >-
      Not run automatically by any workflow -- coordinator-triggered only,
      so the status sheet goes stale after annotation changes until someone
      re-runs it by hand (status_sheet_completeness's drift_risk in
      facts.yaml).
  modes: []

- id: generate_biuniqueness_allomorphy_sheet
  cli_command: generate-biuniqueness-allomorphy-sheet
  description: >-
    Builds the Stage 1 biuniqueness/allomorphy screening sheet (issue #254
    Part 2c); synth0001-only for now.
  side_effects:
    - "creates or updates the biuniqueness_allomorphy_{lang_id} spreadsheet"
  idempotent: true
  idempotency_note: >-
    Rows are derived fresh from planar_{lang_id}.tsv's Biuniqueness_Scope
    column every run; a second run with nothing changed produces the same
    content.
  apply_gate: "--apply"
  preconditions: []
  facts_touched: []
  cascades_triggered: []
  ordering_constraints:
    - >-
      Depends on Biuniqueness_Scope already being filled in on
      planar_{lang_id}.tsv (Part 2a/2b) -- runs outside the standard
      diagnostics_{lang_id}.yaml/generate-sheets class/construction pipeline
      entirely, so nothing else creates its input for it.
  modes: []

