- id: apply_pending
  cli_command: apply-pending
  description: >-
    Interactive review and application of destructive changes recorded by
    import-sheets in pending_changes.json; closes the pending-changes issue
    when cleared.
  side_effects:
    - "applies coordinator-approved destructive changes to coded_data/ and/or the manifest; clears entries from pending_changes.json"
  idempotent: true
  idempotency_note: >-
    Fixed 2026-08-11 (issue #280): _save_pending(remaining + entries[i:]) is
    now called after every entry's decision, not once after the whole loop.
    Previously, an entry was only dropped from `remaining` after its
    underlying command had already run and returned rc == 0, but the file
    write reflecting that was deferred to the end -- a crash after entry 3
    of 10 succeeded but before the loop finished left pending_changes.json
    still listing entry 3, so a retry re-ran its command a second time. Now
    the file is rewritten immediately after each entry is resolved, so a
    crash at any point leaves the file accurately reflecting exactly what
    has and hasn't run for real. (Whether re-running a *never-attempted*
    entry's command is itself safe still depends on what that command is --
    unrelated to this fix, which is about not re-attempting an
    already-succeeded one.)
  apply_gate: "interactive (per-entry approval, not a single --apply flag)"
  preconditions: []
  facts_touched: []
  cascades_triggered: []
  ordering_constraints:
    - "Only has something to review after import-sheets --apply has written pending_changes.json."
  modes: []

- id: prune_manifest
  cli_command: prune-manifest
  description: >-
    Removes a retired class's entry from the Drive manifest, archives its
    local TSVs, and moves its Drive spreadsheet to _archived/; warns if the
    sheet was edited within 14 days.
  side_effects:
    - "moves coded_data/{lang}/{class}/ TSVs to coded_data/{lang}/archive/{class}/"
    - "moves the class's Drive spreadsheet to the _archived/ subfolder"
    - "removes the class's entry from sheets_manifest.json"
  idempotent: true
  idempotency_note: >-
    Which classes are stale (_find_stale) is recomputed fresh from the
    current manifest at the start of every run, so a class already fully
    pruned (manifest entry gone) correctly won't be reprocessed. Fixed
    2026-08-11 (issue #280): upload_manifest now runs immediately after each
    class's local TSVs are archived and its Drive sheet is moved to
    _archived/, not once after the whole loop over every stale class.
    Previously, a crash after class A's files were archived and its sheet
    moved, but before the loop finished, left the Drive-side manifest still
    showing class A as present -- a retry's _find_stale would see A as stale
    again and reprocess it (likely harmless per-call, since _tsv_paths finds
    nothing and _archive_drive_sheet re-parenting an already-_archived/
    sheet is probably a no-op, but never verified). Now the manifest is
    correct after every class, so that reprocessing path is closed rather
    than merely harmless. The coded_data_clean_tree guard (below) remains
    orthogonal -- it stops this command from acting on an already-stale
    coded_data/ tree, a different concern from mid-run-crash recovery.
  apply_gate: "--apply"
  preconditions: [coded_data_clean_tree]
  facts_touched:
    - {fact: manifest_class_registration, role: writes}
  cascades_triggered: []
  ordering_constraints:
    - "For retiring a class: remove it from diagnostics_{lang_id}.tsv first, then run prune-manifest --apply."
    - >-
      Never use for a rename -- it discards rather than carries annotations
      forward. Use restructure-sheets --rename-class instead (see that
      record's ordering_constraints).
  modes: []

- id: check_notes
  cli_command: check-notes
  description: >-
    Checks collaborator notes Google Docs for new content since the last
    check and files/updates GitHub issues from it.
  side_effects:
    - "creates or comments on GitHub issues summarizing new notes content"
    - "appends an acknowledgment to the collaborator's notes doc"
    - "writes coded_data/notes_state.json (content-hash change-detection state, and, since 2026-08-16, per-annotator issue-ID tracking)"
  idempotent: true
  idempotency_note: >-
    Fixed 2026-08-11 (issue #280): _save_notes_state(state) now runs
    immediately after each language's acknowledgment is appended to its
    notes doc, not once at the very end of main() after every language has
    been processed. The hash driving change detection is computed on the
    doc's content with acknowledgment lines stripped out
    (_strip_acknowledgment_lines), so appending the acknowledgment does not
    itself change it -- previously, a crash after an acknowledgment was
    appended but before the final _save_notes_state call left
    notes_state.json holding the OLD hash, so a retry re-detected the same
    content as new and re-filed/re-acknowledged it. Now each language's hash
    is durable the moment its acknowledgment is written, and the same
    incremental save covers the issue-ID write below.

    A second, independent risk (unaffected by the #280 fix, since it wasn't
    about crash timing) is now also fixed: _get_open_notes_issue used to
    match an existing issue by title substring only, so a manually-renamed
    issue silently stopped being found even while still open, and the next
    run opened a duplicate thread. Fixed 2026-08-16: the issue's number is
    now stored in notes_state.json's _annotator_issues[annotator] once
    found or created, and preferred over the title search (which remains
    only as a one-time fallback for an issue that predates this tracking,
    backfilling the ID once found). A CLOSED issue is deliberately not
    reused even when its ID is known -- closing is how a coordinator marks
    a batch of notes triaged, so new content after that starts a fresh
    issue on purpose, not a bug. See collaborator_notes_surfaced_state's
    drift_risk in facts.yaml for the full account, and
    tests/test_check_notes_snapshot.py's Finding-27-adjacent tests for the
    behavior pinned.
  apply_gate: "--apply"
  preconditions: [check_notes_documents_scope_authorized]
  facts_touched:
    - {fact: collaborator_notes_surfaced_state, role: writes}
  cascades_triggered: []
  ordering_constraints:
    - "Same batched-write-at-end-of-loop shape as issue #280 (import-sheets, apply-pending, prune-manifest); fixed the same way."
  modes: []

