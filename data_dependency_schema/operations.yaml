- id: registry
  cli_command: registry
  writes_to_drive: false
  description: >-
    Shows the derived command inventory: every coding/__main__.py command's
    live argparse flags joined with its operations.yaml record (Phase 5
    unit C, issue #271). `--command CLI_COMMAND` shows one command's full
    detail; with no flags, prints a one-line description of every command.
  side_effects:
    - "none (read-only)"
  idempotent: true
  idempotency_note: >-
    Reads coding/__main__.py's _COMMANDS table, every command module's
    build_parser(), and this file itself, fresh on every call -- never
    caches or writes anything, so repeat runs with nothing changed produce
    identical output by construction. This claim was false until 2026-08-18
    (Phase 8, issue #271's idempotency audit): _load_operations() cached
    the parsed file in a module-level global after its first read, so a
    second build_registry() call in the same process (never an issue for
    the ordinary CLI invocation, a fresh process every time, but a real gap
    for anything importing this module more than once -- a test suite,
    say) silently returned stale data. Fixed by removing the cache; see
    coding/registry.py's own docstring for the full account.
  apply_gate: null
  preconditions: []
  facts_touched: []
  cascades_triggered: []
  modes: []

- id: issue
  cli_command: issue
  writes_to_drive: false
  description: >-
    The workflows' way to file, close or remind on a labelled GitHub issue
    (--file, --close, --remind), keep GitHub's labels in line with
    schemas/issue_labels.yaml (--sync-labels, dry run without --apply), and
    rewrite CLAUDE.md's Labels table from it (--write-label-table). Every
    label is checked against the registry first; an unknown one is refused.
  side_effects:
    - "--file / --close / --remind: creates, edits, comments on or closes GitHub issues"
    - "--sync-labels --apply: creates, edits or deletes GitHub labels; files or closes the label-drift issue"
    - "--write-label-table: rewrites the Labels table in CLAUDE.md"
  idempotent: false
  idempotency_note: >-
    --file --replace, --close, --sync-labels --apply and --write-label-table
    are idempotent: a second run with nothing changed finds the same open
    issue and rewrites it identically, finds nothing open to close, finds
    GitHub's labels already matching, or finds the table already current.
    --file without --replace and --remind add a comment every run, by
    design -- each comment is that day's notice.
  apply_gate: null
  preconditions: []
  facts_touched: []
  cascades_triggered: []
  modes: []

- id: daily_refresh
  cli_command: daily-refresh
  writes_to_drive: false
  description: >-
    The daily refresh, run by .github/workflows/data-refresh.yml: runs the
    import, sync and check commands in order through the dispatcher, files or
    closes each step's GitHub issue, and commits planars-data (and
    regenerated snapshots to planars) between steps. Without --apply, lists
    the steps. Writes nothing to Drive itself; each command it runs is
    checked by the Drive door under its own record.
  side_effects:
    - "runs import-planar, import-sheets, check-notes, sync-diagnostics-yaml (both directions), sync-params, generate-sheets --regen-dependents, update-sheets and generate-status-sheet with --apply, each with its own side effects"
    - "files, updates or closes the daily issues (planar-changed, import-error, diagnostics-yaml-error, regen-dependents-error, dependent-stale, diagnostics-drift, codebook-error, stale-manifest, integrity-error, data-overwrite, sheet-drift, status-sheet-error) and comments on stale pending-changes issues"
    - "files an audit issue when none is open and none has closed in 30 days"
    - "commits and pushes coded_data/ (planars-data) after the import, the diagnostics sync, the checks and the status sheets"
    - "regenerates tests/snapshots/ and commits and pushes it to planars"
    - "deletes diagnostics_drift.json and /tmp/planar_changes.json before the steps that write them"
  idempotent: false
  idempotency_note: >-
    A second run with nothing changed in Drive imports nothing new, commits
    nothing and leaves each issue as it was (replaced with the same body, or
    nothing open to close), but adds another reminder comment to a stale
    pending-changes issue, as the workflow always did.
  apply_gate: "--apply"
  preconditions: [coded_data_clean_tree]
  facts_touched: []
  cascades_triggered: []
  modes: []
