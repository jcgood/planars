# planars' shared command-precondition registry. Distinct from facts.yaml:
# these aren't the same fact recorded in multiple places, they're invariants
# that more than one coding/ command assumes hold before it runs, discovered
# because writing facts.yaml surfaced that this class of dependency doesn't
# fit the fact-record shape. See SCHEMA.md.

- id: coded_data_clean_tree
  description: >-
    coded_data/ has no uncommitted changes before a command reads/writes it
    as ground truth (planar TSVs, diagnostics TSVs/YAML, construction TSVs).
  required_by:
    - "import_sheets.py (import-sheets --apply)"
    - "update_sheets.py (update-sheets --apply)"
    - "sync_params.py (sync-params --apply)"
    - "generate_sheets.py (--regen-dependents)"
    - "restructure_sheets.py (restructure-sheets --apply)"
    - "prune_manifest.py (prune-manifest --apply)"
    - "sync_diagnostics_yaml.py (sync-diagnostics-yaml --apply, all three directions)"
    - "daily_refresh.py (daily-refresh --apply, before its first step)"
  enforced_by: >-
    drive._check_coded_data_clean() -- called at the top of each apply path
    above; raises SystemExit(1) if coded_data/ has uncommitted changes
    matching the given extensions (default: .tsv; sync_diagnostics_yaml.py
    passes (".yaml", ".tsv") since it reads/writes both).
  failure_symptom: >-
    a command reads a stale/reverted file as current and acts on it -- e.g.
    update-sheets wrote a blank retired-element row to 16 live sheets on
    2026-07-29 because it read a reverted planar_stan1293.tsv left on disk by
    import-planar's failed auto-commit (see
    coded_data_git_identity_configured, below).
  established: >-
    2026-07-29, after the #248 stray-row incident. Previously only
    import_sheets.py had this guard; centralized into drive.py and wired
    into the other three commands the same day. prune_manifest.py and
    sync_diagnostics_yaml.py both added 2026-08-11 -- both found missing
    (the former archives local TSVs out of coded_data/, the latter reads
    the YAML as ground truth for all three of its directions and writes
    the TSV/YAML for two of them) while reviewing preconditions for the
    Phase 4 (#271) operation registry; fixed the same day found, same
    reasoning as every other small fix this project makes on sight rather
    than deferring.

    2026-08-20: found that .github/workflows/data-refresh.yml itself
    violated this precondition's own assumption -- the same shape as
    coded_data_git_identity_configured's #245 precedent below, just on the
    workflow-ordering side instead of the git-identity side.
    import-sheets writes to coded_data/ (new TSVs, archived-on-change
    files) but does not self-commit via _autocommit_data() the way
    import_planar.py/restructure_sheets.py do; the workflow's only commit
    step ran once, near the very end of the job. Every coded_data_clean_tree
    -gated command between "Import annotation data" and that final commit
    (sync-diagnostics-yaml, sync-params, generate-sheets --regen-dependents)
    was therefore running against an already-dirtied tree and silently
    aborting on this very guard whenever import-sheets or check-notes
    actually changed a file -- invisible until issue #283 added real
    issue-filing to two of those three commands, which is what surfaced it
    (issues #289, #290) rather than introduced it. Fixed by adding a second,
    earlier commit-and-push step right after check-notes, before any
    coded_data_clean_tree-gated command runs -- committing promptly instead
    of leaving same-run intermediate state looking dirty to a precondition
    meant to catch a genuinely stale prior run.

    2026-08-20, same day, found live: a second instance of the identical
    pattern, this time self-inflicted between sync-diagnostics-yaml's own
    two directions rather than between two different commands.
    sync-diagnostics-yaml --apply (YAML -> TSV) can now genuinely write
    diagnostics_{lang}.tsv (gap 1's own fix un-blocked arao1248's write,
    previously silently skipped over its non-blocking proform gap) --
    but nothing committed that write before --to-sheet --apply, this
    command's own next direction, ran moments later in the same job and
    aborted on its sibling's uncommitted output. Caught by manually
    triggering the workflow the same day the ordering fix above shipped,
    specifically to confirm it -- #289 and #290 both cited the same file
    (arao1248/lang_setup/diagnostics_arao1248.tsv). Fixed the same way:
    a third commit-and-push step, between sync-diagnostics-yaml's two
    directions. sync_params.py (next in the job) was checked and confirmed
    not to write to coded_data/ on its automated bare --apply invocation
    (no --rename/--split/--merge), so it was not given the same treatment
    -- but is worth re-checking if this pattern surfaces a third time.

    Since 2026-10-17 (Phase 10 unit 8) these commits are steps of
    coding/daily_refresh.py (commit_data), in the same places.

- id: coded_data_git_identity_configured
  description: >-
    coded_data/'s git user.name/user.email are set before any code path
    calls drive._autocommit_data() against it.
  required_by:
    - "import_planar.py (import-planar --apply, via _autocommit_data)"
    - "restructure_sheets.py (--apply, via _autocommit_data)"
  enforced_by: >-
    Two layers: (1) .github/workflows/data-refresh.yml's "Configure git
    identity" step (global, so it covers coded_data/ and planars) runs
    immediately after credentials are written, before daily-refresh touches
    coded_data/, so the identity is
    normally already present by the time _autocommit_data runs in CI. (2)
    drive._autocommit_data() itself now raises SystemExit on a failed
    `git add`/`git commit` (added 2026-07-29) instead of printing a WARNING
    and returning, so any cause of a failed commit -- not just a missing
    identity -- is caught at its actual source rather than relying on a
    downstream command to notice the resulting dirty tree.
  failure_symptom: >-
    Before the 2026-07-29 fix: git commit failed with "please tell me who
    you are"; _autocommit_data printed a WARNING and returned silently,
    leaving coded_data/ dirty for the next command to trip over
    (coded_data_clean_tree, above). Exactly what happened on 2026-07-29
    (#245): the workflow originally configured git identity only in the
    final "commit and push" step, far too late for import-planar's own
    inline commit. Since the fix, an add/commit failure now raises
    immediately from within _autocommit_data itself, regardless of cause.
  established: >-
    2026-07-29, after the #248 stray-row incident. The raise-on-failure fix
    (layer 2) was added the same day this precondition was first written
    down: documenting "enforced_by: workflow ordering only" made the
    remaining gap (a silently-swallowed commit failure inside
    _autocommit_data) visible enough to close immediately rather than
    leaving it as a known-but-undocumented weak point -- exactly the outcome
    this registry exists to produce.

- id: coded_data_up_to_date
  description: >-
    coded_data/ has every commit GitHub's planars-data has, before a command
    acts on state another machine may have written: the daily refresh's
    pending changes (written on GitHub's machine), or a restructure journal
    left by an interrupted run elsewhere (coding/state_files.py).
  required_by:
    - "apply_pending.py (apply-pending)"
    - "restructure_sheets.py (restructure-sheets --apply)"
  enforced_by: >-
    preconditions.py, from each command's operations.yaml record:
    state_files.behind_remote() fetches and counts the commits coded_data/
    lacks; one or more stops the command with the pull to run. If it can't
    tell (no network, no upstream branch) it stops too, and says why. Skipped
    when coded_data/ is not a git repository.
  failure_symptom: >-
    apply-pending reports "no pending changes" while the pending-changes
    issue says there are some; or restructure-sheets starts new work over an
    interrupted run it can't see.
  established: >-
    2026-10-20, Phase 10 unit 12, when the state files moved from the repo
    root of whichever machine ran the command into planars-data.

- id: check_notes_documents_scope_authorized
  description: >-
    the cached OAuth token at ~/.config/gspread/authorized_user.json (or the
    GOOGLE_OAUTH_TOKEN secret in CI) includes the Google Docs `documents`
    scope, not just the Sheets/Drive scopes every other command needs.
  required_by:
    - "check_notes.py (check-notes --apply, reads/writes the per-language collaborator notes Google Doc)"
  enforced_by: >-
    Nothing automated. A one-time manual re-authorization step, documented
    in docs/coordinator-guide.md's "Re-authorization after scope changes":
    delete the cached token and re-run a non-destructive command to trigger
    a fresh browser auth flow, then update the GOOGLE_OAUTH_TOKEN GitHub
    secret so scheduled runs pick it up too.
  failure_symptom: >-
    check-notes fails with a Docs API permission/scope error while every
    other command (generate-sheets, import-sheets, update-sheets,
    sync-params, restructure-sheets) keeps working fine, since none of them
    touch the Docs API -- this is the one command with a strictly wider
    scope requirement than the rest, and nothing checks for it up front.
  established: "documented in docs/coordinator-guide.md since the documents scope was added for collaborator notes; recorded here 2026-07-29"
