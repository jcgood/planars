# planars' data-dependency fact registry. This is the living registry, not a
# sample or smoke test -- see SCHEMA.md for the field-by-field spec and "How
# to use this" for how to add to it. Not exhaustive: populated incrementally,
# starting from the facts surfaced by the 2026-07-29 planar-Sheet-revert
# incident (#244/#245/#248) plus a few other known dependencies already
# documented informally in CLAUDE.md.

- id: planar_sheet_structure
  description: a language's positional/element structure (Position_Name/Elements columns)
  locations:
    - {entity: planar_sheet, detail: "the live planar spreadsheet for the language (planar_spreadsheet_id in drive_config.json)"}
    - {entity: planar_tsv, detail: "coded_data/{lang}/lang_setup/planar_{lang_id}.tsv"}
    - {entity: annotation_sheet, detail: "every construction tab's Element/Position_Name/Position_Number columns, regenerated by restructure-sheets from the planar structure"}
  authoritative: planar_sheet
  cascade:
    direction: bidirectional
    mechanism: >-
      import-planar --apply downloads planar_sheet -> planar_tsv (the normal
      direction). restructure-sheets --split-element/--rename-map/--rename-class
      --apply edits planar_tsv directly (the structural-change direction) and,
      since #248, pushes that edit back to planar_sheet via
      import-planar --to-sheet --apply in the same run.
  drift_risk:
    possible: true
    note: >-
      Before #248, the local-edit direction had no push mechanism at all; the
      next scheduled import-planar --apply silently reverted it, because it
      had no way to know planar_sheet was now stale. Exactly what happened on
      2026-07-29 to #236's pronoun split (see #244/#245). #248's fix only
      covered restructure-sheets, though -- tests/make_synthetic_lang.py is a
      second, independent planar_tsv writer (edits synth0001's planar_tsv
      directly to regenerate the synthetic test dataset) that was never wired
      into the same push. On 2026-07-31 its --full-copy regeneration (#254
      Part 1) went un-pushed, the next scheduled import-planar --apply
      reverted planar_tsv back to the old ~28-position structure, and that
      cascaded into 7 downstream construction_tsvs and the diagnostics_tsv
      also getting resynced to the stale shape (#256/#258/#259/#257,
      remediated in planars-data commit 94fea13). A one-time migration script
      (migrations/backfill_biuniqueness_scope_synth0001.py, planars#254 Part
      2b) hit the identical gap the same day, editing planar_tsv directly
      with no push. Fixed going forward by adding the same
      push_planars_to_sheets() call make_synthetic_lang.py's --apply path
      (mirrors restructure_sheets.py). General lesson: any script that edits
      planar_tsv directly needs this push, not just restructure-sheets --
      check for it by name in a new script rather than assuming the risk is
      already covered project-wide.
    caught_by: >-
      nothing yet beyond the daily import-planar --apply step noticing a diff
      and filing a planar-changed issue -- which can't distinguish "the Sheet
      legitimately changed" from "the TSV was edited locally and never
      pushed," since both look identical from import-planar's side. This is
      still true even after the 2026-07-31 fix: it stops make_synthetic_lang.py
      from causing new drift, but doesn't add detection for a *future* script
      that writes planar_tsv directly and forgets the same push.

- id: diagnostics_scope
  description: which classes/constructions/criteria are in scope for a language's diagnostics
  locations:
    - {entity: diagnostics_yaml, detail: "coded_data/{lang}/lang_setup/diagnostics_{lang_id}.yaml -- coordinator-facing source of truth"}
    - {entity: diagnostics_tsv, detail: "coded_data/{lang}/lang_setup/diagnostics_{lang_id}.tsv"}
    - {entity: diagnostics_sheet, detail: "the live diagnostics spreadsheet (diagnostics_spreadsheet_id)"}
  authoritative: diagnostics_yaml
  cascade:
    direction: automatic
    mechanism: >-
      sync-diagnostics-yaml (default) regenerates diagnostics_tsv from
      diagnostics_yaml; sync-diagnostics-yaml --to-sheet pushes the same
      content to diagnostics_sheet. Both run automatically in data-refresh.yml.
  drift_risk:
    possible: true
    note: >-
      A coordinator can edit diagnostics_yaml locally and forget to run
      sync-diagnostics-yaml --apply before committing, or a collaborator can
      edit diagnostics_sheet directly and have it silently overwritten by the
      next --to-sheet push. A third, more severe case: diagnostics_yaml can go
      missing entirely while diagnostics_tsv survives -- not drift between two
      live copies, but total loss of the authoritative source with the
      derived artifact left behind as if nothing were wrong.
      coding.make_forms._read_diagnostics_for_language() falls back to
      reading diagnostics_tsv directly whenever diagnostics_yaml.exists() is
      false (originally meant only for languages never migrated to the
      YAML-first workflow), so this failure mode produces no error anywhere
      in the ordinary pipeline -- it was only found because a test-fixture
      regeneration (tests/make_synthetic_lang.py --clean --apply) deleted
      synth0001's YAML and the script never regenerated one (see #254).
    caught_by: >-
      data-refresh.yml's "Regenerate diagnostics TSVs from YAML" step catches
      the first case; sync-diagnostics-yaml --from-tsv's ambiguous-drift
      detection (filed as diagnostics-drift) partially catches the second --
      only for changes it can't auto-resolve. The third case (missing YAML)
      is now caught by check-codebook's check 7
      (_check_diagnostics_yaml_exists): hard error if any
      diagnostics_{lang_id}.tsv has no matching .yaml. Runs in CI on every
      push per check-codebook's own invocation.

- id: languages_metadata
  description: a language's Glottolog metadata plus project metadata (source, author, annotation_status)
  locations:
    - {entity: schema_yaml, detail: "schemas/languages.yaml -- the source of truth"}
    - {entity: manifest, detail: "sheets_manifest.json's synced copy, written by generate-sheets/import-sheets"}
  authoritative: schema_yaml
  cascade:
    direction: automatic
    mechanism: >-
      generate-sheets and import-sheets both write a fresh copy of
      schemas/languages.yaml into the manifest after loading it (CLAUDE.md:
      "Always edit languages.yaml, not the manifest").
  drift_risk:
    possible: true
    note: >-
      If someone edits the manifest's copy directly, that edit is silently
      overwritten on the next generate-sheets/import-sheets run -- or, if
      neither runs again soon, the two simply disagree in the meantime.
    caught_by: "nothing yet -- no automated check compares the two copies."

- id: qualification_rule_semantics
  description: the prose description of how a class's span/qualification logic works
  locations:
    - {entity: schema_yaml, detail: "diagnostic_classes.yaml's qualification_rule field for the class"}
    - {entity: code_comment, detail: "the corresponding planars/{module}.py docstring and inline comments describing the same rule"}
  authoritative: schema_yaml
  cascade:
    direction: manual
    mechanism: >-
      A coordinator (with Claude) edits diagnostic_classes.yaml, changing its
      qualification_rule_hash; check-codebook detects the mismatch and
      generate-rule-update-prompt produces a ready-to-paste Claude prompt to
      update the module's docstring/comments to match, ending with
      sync-qualification-hashes --apply to re-stamp the hash once reviewed.
  drift_risk:
    possible: true
    note: >-
      Between the YAML edit and the human-reviewed docstring update, the two
      are out of sync by design -- that's the point of the hash sentinel, it's
      meant to be caught, not prevented.
    caught_by: >-
      check-codebook's qualification_rule_hash check, run in CI on every push
      and daily via data-refresh.yml, filed as codebook-error if stale.

- id: dependent_construction_element_scope
  description: >-
    which elements are in scope for a "prescreening -> pair construction"
    dependent pair, e.g. nonpermutability's element_prescreening feeding
    general's pair list (same shape recurs for coreference's prescreening
    feeding reflexivization/pronominalization/np_reference)
  locations:
    - {entity: construction_tsv, detail: "the SOURCE construction's in-scope decisions, e.g. nonpermutability/element_prescreening.tsv -- this is the authoritative one"}
    - {entity: construction_tsv, detail: "the DEPENDENT pair-row construction's Element_A/Element_B pairs, e.g. nonpermutability/general.tsv"}
  authoritative: construction_tsv
  cascade:
    direction: manual
    mechanism: >-
      generate-sheets --regen-dependents auto-regenerates the dependent pair
      table from the source, but ONLY when the dependent tsv doesn't exist yet
      or has no annotation data -- otherwise it skips and defers to a
      coordinator running generate-sheets --regen-construction CLASS:DEPENDENT
      by hand, since the dependent table may carry real judgments a mechanical
      regeneration would need to reconcile, not overwrite.
  drift_risk:
    possible: true
    note: >-
      restructure-sheets --split-element/--rename-element do NOT cascade into
      dependent pair-row tables (#241) -- a retired element can be orphaned in
      Element_A/Element_B cells, or a newly-in-scope element can be entirely
      absent from the pair list, with no mechanical fix once real annotation
      data exists on the dependent side.
    caught_by: >-
      integrity-check's dependent-construction-staleness check, run daily and
      filed as dependent-stale. Currently open for exactly this reason: #241
      and its 2026-07-29 addendum, both awaiting Adam's linguistic judgment.

- id: sheet_change_notification_state
  description: whether a language's collaborator(s) have been notified their annotation sheets changed
  locations:
    - {entity: manifest, detail: "sheets_manifest.json's notification_issue field for the language"}
    - {entity: github_issue, detail: "the per-language 'Sheet updates -- {lang_id}' issue itself -- its comment history IS the notification record"}
  authoritative: github_issue
  cascade:
    direction: automatic
    mechanism: >-
      restructure-sheets --apply calls notify.py after a language's sheets
      actually change: ensure_notification_issue finds-or-creates the
      per-language issue (writing its number into the manifest the first
      time), then post_notification_comment posts the change summary.
  drift_risk:
    possible: true
    note: >-
      If the manifest's notification_issue number and the actual issue
      diverge (manually closed/deleted, or manifest hand-edited),
      ensure_notification_issue could create a duplicate or post nowhere.
    caught_by: "nothing yet -- not checked by integrity-check today."

- id: status_sheet_completeness
  description: a language's per-construction annotation completeness percentage, as shown on its locked status spreadsheet
  locations:
    - {entity: construction_tsv, detail: "the actual annotated cell values counted by validate_coding.annotation_status()"}
    - {entity: status_sheet, detail: "the completeness percentage and color-coded status cell generate_status_sheet.py writes per construction"}
  authoritative: construction_tsv
  cascade:
    direction: manual
    mechanism: >-
      python -m coding generate-status-sheet --apply recomputes and rewrites
      the status sheet from current construction_tsv/annotation_sheet state.
      Not run automatically by data-refresh.yml or any other workflow --
      coordinator-triggered only (see coding/CLAUDE.md's generate_status_sheet.py entry).
  drift_risk:
    possible: true
    note: >-
      Every annotation change (import-sheets pulling in new judgments, a
      construction being added/removed) leaves the status sheet showing a
      stale percentage until someone remembers to re-run generate-status-sheet
      by hand. There's no trigger tying the two together.
    caught_by: "nothing yet -- not checked by integrity-check, not wired into data-refresh.yml."

- id: manifest_class_registration
  description: which analysis classes have a registered annotation spreadsheet for a language
  locations:
    - {entity: diagnostics_yaml, detail: "which classes are declared for the language"}
    - {entity: manifest, detail: "sheets_manifest.json's per-language sheets dict -- one entry per class with a live spreadsheet"}
  authoritative: diagnostics_yaml
  cascade:
    direction: manual
    mechanism: >-
      A class removed from diagnostics_yaml leaves a stale manifest entry
      until a coordinator runs prune-manifest --apply (archives the TSVs,
      moves the Drive spreadsheet to _archived/, removes the manifest
      entry). A class added to diagnostics_yaml needs generate-sheets to
      create the corresponding spreadsheet and manifest entry in the first
      place -- nothing detects a newly-declared class automatically.
  drift_risk:
    possible: true
    note: >-
      Retiring a class in diagnostics_yaml without running prune-manifest
      leaves data-refresh.yml re-importing (and re-checking) a Sheet nobody
      intends to keep using, indefinitely.
    caught_by: >-
      integrity-check's stale manifest entry check (_stale_manifest_classes),
      run in the default per-language section and daily via data-refresh.yml,
      filed as stale-manifest.

- id: manifest_dropdown_values
  description: >-
    a construction's allowed dropdown values per criterion, as the manifest
    believes they currently are vs. what the diagnostics YAML would produce
  locations:
    - {entity: diagnostics_yaml, detail: "each criterion's current allowed-value list (e.g. y/n vs y/n/both)"}
    - {entity: manifest, detail: "sheets_manifest.json's construction_params[construction].param_values -- a staleness reference, not a live copy of the Sheet's actual validation rule"}
  authoritative: diagnostics_yaml
  cascade:
    direction: manual
    mechanism: >-
      sync-params --refresh-dropdowns --apply pushes the current
      YAML-derived allowed values to the live Sheet's dropdown validation
      AND updates the manifest's stored param_values to match. Nothing runs
      this automatically -- a criterion's value list can change in the YAML
      with no corresponding sheet/manifest update until a coordinator
      notices and runs it.
  drift_risk:
    possible: true
    note: >-
      manifest_dropdown_values tracks the manifest's belief about the
      Sheet, not the Sheet's actual live validation rule -- a coordinator
      editing dropdown values directly in the Sheets UI (bypassing
      sync-params entirely) would go undetected by this check, which only
      compares the manifest against the YAML.
    caught_by: >-
      integrity-check's default per-language section
      (_stale_manifest_param_values), run daily via data-refresh.yml,
      surfaced as a generic integrity-error rather than a dedicated label
      the way stale-manifest is.

- id: pair_row_position_numbers
  description: the position NUMBER embedded in a pair-row construction's Position_A/Position_B cells (format "N (name)") must match the current planar structure's numbering for that position name
  locations:
    - {entity: annotation_sheet, detail: "live pair-row tabs -- nonpermutability/general is Element_A/Element_B-only and unaffected; coreference's three constructions use Element_A + Position_A/Position_B/Direction and are the ones exposed"}
    - {entity: construction_tsv, detail: "coded_data/{lang}/coreference/{reflexivization,pronominalization,np_reference}.tsv -- local copies of the above"}
    - {entity: planar_tsv, detail: "coded_data/{lang}/lang_setup/planar_{lang_id}.tsv -- current source of truth for which number a position name has"}
  authoritative: planar_tsv
  cascade:
    direction: manual
    mechanism: >-
      restructure-sheets --rename-map cascades a position NAME change into
      pair-row Position_A/Position_B cells automatically
      (_cascade_rename_pair_tsv/_cascade_rename_pair_tab). Nothing cascades
      a position NUMBER change from an insertion or deletion elsewhere in
      the planar shifting everything after it -- that requires a
      coordinator to explicitly pass --pos-remap OLD:NEW to
      generate-sheets --regen-construction, and until issue #241 nothing
      told them to, or what the correct mapping was.
  drift_risk:
    possible: true
    note: >-
      Discovered 2026-07-31: stan1293's coreference pair-rows (including a
      cited Lasnik reflexivization judgment) referenced v:obj-part/v:rec by
      position numbers that predate v:obj-R's insertion into the planar --
      apparently since the coreference sheets were first generated, since
      v:obj-R has existed in every tracked planar_stan1293.tsv commit back
      to this repo's March 2026 start. 53 annotated pair-rows were one
      --regen-construction away from being silently dropped with no trace
      (see #241's data-loss guard, which is what surfaced this) before it
      was caught and recovered via --pos-remap. synth0001 has the
      identical drift as of this writing (low-stakes, no real annotation
      to lose).
    caught_by: >-
      integrity-check's DEPENDENT CONSTRUCTION STALENESS section, since
      issue #241 (_find_stale_position_cells/_suggest_position_remap).
      Before that, nothing checked this at all -- element-set comparison
      alone cannot see it, since the element itself is often still validly
      in scope, just paired via a stale position number.

- id: drive_state_test_fixtures
  description: >-
    the recorded live Drive state (every annotation spreadsheet's tab order,
    grid size, and cell values, plus the manifest) replayed by the fake Drive
    backend in tests
  locations:
    - {entity: annotation_sheet, detail: "the live spreadsheets themselves -- the only real state"}
    - {entity: manifest, detail: "manifest.json on Drive (Drive-ID bookkeeping for every language/class)"}
    - {entity: test_fixture, detail: "tests/fixtures/drive_state/{lang}/*.json and manifest.json, written by capture-drive-state --apply"}
  authoritative: annotation_sheet
  cascade:
    direction: automatic
    mechanism: >-
      python -m coding capture-drive-state --apply re-records every listed
      spreadsheet and the manifest, overwriting the fixtures. Read-only against
      Drive: it is the one live call permitted before Phase 9 of the data layer
      plan. Nothing cascades in the other direction, by design -- the fixtures
      are never written back.
  drift_risk:
    possible: true
    note: >-
      The fixtures are a snapshot (first taken 2026-08-01) and go stale as soon
      as anyone annotates, which is continuously. That is acceptable for what
      they are used for -- proving the fake reproduces real API *response
      shapes*, which change far more slowly than cell contents -- but it is a
      real trap in two ways. First, a test that asserts on fixture cell values
      is asserting on 2026-08-01's annotations, not on current data. Second, a
      structural change to the live sheets (a new tab, a renamed column, a
      changed criterion set) makes the fixtures describe a Drive that no longer
      exists, and every golden built on them keeps passing regardless. The
      fixtures must not be hand-edited to "fix" such a divergence: re-run
      capture-drive-state, which is the only thing that keeps them a recording
      rather than a fabrication.
    caught_by: >-
      nothing automatically. tests/test_drive_backend.py proves the fake is
      faithful to the fixtures, not that the fixtures are faithful to Drive.
      Re-running capture-drive-state --apply and inspecting git diff on
      tests/fixtures/drive_state/ is the only check, and it is manual.
