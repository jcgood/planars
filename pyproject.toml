[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "planars"
version = "0.1.0a28"
requires-python = ">=3.9"
dependencies = ["pandas", "pandera", "plotly", "pyyaml"]
description = "Toolkit for deriving morphosyntactic constituency spans from annotated planar structures"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Jeff Good" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Text Processing :: Linguistic",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
pdf = ["weasyprint", "kaleido"]

[project.urls]
Repository = "https://github.com/jcgood/planars"

[tool.setuptools.packages.find]
include = ["planars*", "coding*", "schemas*"]

[tool.setuptools.package-data]
schemas = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Tests that need R installed, and usually the pinned R packages that
    # NonCollaborative/renv.lock records. CI has no R, so it runs the
    # NonCollaborative suite as: pytest NonCollaborative/tests -m "not needs_r".
    # Running them needs a Mac set up for the chart work; see
    # NonCollaborative/CLAUDE.md.
    "needs_r: requires R (and, for the chart checks, poppler)",
]
