repos:
  - repo: local
    hooks:
      - id: regenerate-snapshots
        name: Regenerate snapshots for changed analyses
        entry: .venv/bin/python regenerate_snapshots_hook.py
        language: system
        pass_filenames: false
        files: ^planars/.*\.py$
        stages: [pre-commit]

      - id: check-snapshots
        name: Check snapshots are up to date
        entry: .venv/bin/python check_snapshots.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # The planarsviz package's NAMESPACE and man/ pages are generated from
      # the #' comments in its R/ files. Edit a comment without re-running
      # roxygen2 and they quietly fall out of step: the package still loads,
      # R CMD check still passes, and the wrong help page surfaces months
      # later. This check runs here rather than in CI because CI has no R --
      # and it takes about 7 seconds, only when the package itself changed.
      # It skips cleanly on a machine without R or roxygen2.
      - id: roxygen-up-to-date
        name: Check the planarsviz R docs match its source
        entry: .venv/bin/python -m pytest NonCollaborative/tests/test_roxygen_up_to_date.py -q
        language: system
        pass_filenames: false
        files: ^NonCollaborative/planarsviz/
        stages: [pre-push]

      # Phase D's tooling pass (2026-09-22) added lintr and styler as the
      # package's lint/format tools. Same reasoning as the roxygen guard
      # above: runs here because CI has no R, only when the package changed,
      # and skips cleanly on a machine without R or these packages.
      - id: lint-clean
        name: Check the planarsviz package has no lintr findings
        entry: .venv/bin/python -m pytest NonCollaborative/tests/test_lint_clean.py -q
        language: system
        pass_filenames: false
        files: ^NonCollaborative/planarsviz/
        stages: [pre-push]

      - id: styler-up-to-date
        name: Check the planarsviz R source matches styler's formatting
        entry: .venv/bin/python -m pytest NonCollaborative/tests/test_styler_up_to_date.py -q
        language: system
        pass_filenames: false
        files: ^NonCollaborative/planarsviz/
        stages: [pre-push]
