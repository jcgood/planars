# GitHub issue labels — the one place they are defined (Phase 10 unit 10, issue #271).
#
# Everything else is a copy made from this file:
#   - the labels on GitHub itself (name, colour, short description), brought
#     into line daily by `python -m coding issue --sync-labels --apply`, the
#     daily refresh's first step (coding/daily_refresh.py);
#   - the Labels table in CLAUDE.md, rewritten by the pre-commit hook whenever
#     this file is committed (tests/test_issues.py fails if it is out of date).
#
# coding/issues.py refuses to file or look up an issue under a label not listed
# here, so a misspelt label fails loudly instead of creating a stray one.
#
# To add a label: add an entry here and commit. Nothing else needs editing.
#
# Fields:
#   name         the label as it appears on GitHub
#   color        six hex digits, no '#'
#   description  GitHub's short description (at most 100 characters)
#   meaning      the fuller explanation shown in CLAUDE.md's table (Markdown)
#   filed_by     who puts the label on an issue: "by hand", or the command or
#                workflow that files it automatically
#   retired      (optional) when and why it stopped being used. The label stays
#                on GitHub for the closed issues that carry it, but nothing can
#                be filed under it, and CLAUDE.md's table leaves it out.

labels:

  # --- Applied by hand -------------------------------------------------------

  - name: diagnostics
    color: "0075ca"
    description: "Module design, parameters, or span rules needing linguistic validation"
    meaning: >-
      Requires linguistic validation from Adam before implementation. Also
      filed by `generate-sheets` when an element's prescreening value differs
      by position. Filter: `gh issue list --label diagnostics`
    filed_by: "by hand; generate-sheets"

  - name: linguistics
    color: "5319e7"
    description: "Linguistically-driven, requires domain expertise"
    meaning: Linguistically driven; needs domain expertise to settle.
    filed_by: by hand

  - name: needs-input
    color: "e4e669"
    description: "Requires input from Adam or other domain expert"
    meaning: Waiting on input from Adam or another domain expert.
    filed_by: by hand

  - name: Jeff
    color: "fbca04"
    description: "Requires Jeff's input or decision"
    meaning: Waiting on a decision from Jeff.
    filed_by: by hand

  - name: design
    color: "0052cc"
    description: "Architectural or forward-looking design decisions"
    meaning: Architectural or forward-looking design decisions.
    filed_by: by hand

  - name: infrastructure
    color: "b60205"
    description: "Tooling, scripts, and workflow"
    meaning: Tooling, scripts and workflows.
    filed_by: by hand

  - name: codebook
    color: "c2e0c6"
    description: "Criterion definitions and the rendered codebook (schemas/diagnostic_criteria.yaml)"
    meaning: Criterion definitions and the rendered codebook (`schemas/diagnostic_criteria.yaml`, `render_codebook.py`).
    filed_by: by hand

  - name: notebooks
    color: "f9d0c4"
    description: "Colab or Jupyter notebook related"
    meaning: Colab notebooks and their templates.
    filed_by: by hand

  - name: bug
    color: "d73a4a"
    description: "Something isn't working"
    meaning: Something isn't working.
    filed_by: by hand

  - name: enhancement
    color: "a2eeef"
    description: "New feature or request"
    meaning: New feature or request.
    filed_by: by hand

  - name: documentation
    color: "0075ca"
    description: "Improvements or additions to documentation"
    meaning: Improvements or additions to documentation.
    filed_by: by hand

  # --- Filed automatically ---------------------------------------------------

  - name: sheet-validation
    color: "e4e669"
    description: "Automated sheet validation failure"
    meaning: >-
      Filed when `validate-coding` finds **errors** (or crashes). Advisory
      warnings never file or hold open an issue — they appear as context
      only. One open issue per *problem*, not per label: a later run
      reporting the same problem rewrites its body in place, notifying
      nobody, and a run reporting a different
      one closes it as superseded and files a new one. Auto-closed when no
      errors remain.
    filed_by: validation-report --apply (sheet-validation.yml)

  - name: needs-fixing
    color: "f9d0c4"
    description: "An annotator has values to fix, or finished tabs were marked ready-for-review"
    meaning: >-
      One issue per language, for its annotator (issue #309; "To do in the
      {Name [glottocode]} sheets"): how many cells need fixing in which sheet
      (on tabs marked ready-for-review, listed in each sheet's Status tab),
      and which in-progress tabs the check marked ready-for-review because
      every cell was answered with no errors. Mentions the annotator when
      people.yaml has their GitHub username; otherwise a comment on the
      spreadsheet emails them. When the check marks a tab, a comment also
      mentions the other coordinators and the owner (people.yaml). A new
      notice is posted only when the list changes, not daily. Auto-closed
      when nothing is left.
    filed_by: validate-coding --notify (sheet-validation.yml)

  - name: sheet-drift
    color: "e4e669"
    description: "Google Sheets out of sync with data model — run update-sheets --apply"
    meaning: >-
      Sheets are out of sync with the data model. Resolve: `update-sheets
      --apply`. Auto-closed when clean.
    filed_by: data-refresh.yml

  - name: pending-changes
    color: "e99695"
    description: "Destructive sheet changes awaiting coordinator approval"
    meaning: >-
      Destructive changes landed in `pending_changes.json`. Resolve:
      `apply-pending`, which closes the issue once every change is handled.
      A reminder is added daily once the issue is a week old.
    filed_by: import-sheets
    retired: >-
      2026-10-24: its changes came from edits to the planar and diagnostics
      Sheets, which became read-only copies (Phase 10 unit 11b); apply-pending
      was retired with it

  - name: diagnostics-drift
    color: "fbca04"
    description: "Ambiguous diagnostics TSV/YAML drift — run sync-diagnostics-yaml --from-tsv --apply"
    meaning: >-
      `import-sheets` found ambiguous TSV→YAML differences. Resolve: edit
      the YAML, run `sync-diagnostics-yaml --apply`. Auto-closed when clear.
    filed_by: data-refresh.yml
    retired: >-
      2026-10-24: the diagnostics Sheet became a read-only copy of the YAML
      (Phase 10 unit 11b), so nothing is read back from it to differ

  - name: diagnostics-yaml-error
    color: "d73a4a"
    description: "Filed when sync-diagnostics-yaml finds a blocking diagnostics YAML error."
    meaning: >-
      `sync-diagnostics-yaml` found a blocking
      `diagnostics_{lang_id}.yaml` validation error — a malformed YAML, not
      schema inconsistency (`codebook-error`) — so the diagnostics Sheet was
      not updated. A non-blocking error (e.g. a required class not yet
      drafted) does not trigger this. Resolve: fix the YAML, run
      `sync-diagnostics-yaml --apply`. Auto-closed when clean.
    filed_by: data-refresh.yml

  - name: import-error
    color: "b60205"
    description: "Filed automatically when data-refresh import-sheets step fails"
    meaning: >-
      `import-sheets --apply` exited non-zero. The issue body contains the
      failure output. Auto-closed when import succeeds.
    filed_by: data-refresh.yml

  - name: codebook-error
    color: "e4e669"
    description: "Filed automatically when check-codebook detects schema inconsistencies in data-refresh"
    meaning: >-
      `check-codebook` found schema inconsistencies in the daily refresh (CI
      also runs the check on every push, but files nothing). Auto-closed when
      the check passes.
    filed_by: data-refresh.yml

  - name: data-overwrite
    color: "B60205"
    description: "Filed when today's data refresh replaced a change someone made to a planars-data file."
    meaning: >-
      Today's refresh replaced a file whose last change, in the language's
      change log (`changes.tsv`), was made by a different command someone
      ran (a migration, restructure-sheets). The issue names each file and
      the archive copy holding the replaced version; compare it with the
      current file. Auto-closed when clean.
    filed_by: daily-refresh --apply (data-refresh.yml)

  - name: planar-changed
    color: "E4E669"
    description: "A planar file changed. Resolve: update-sheets or restructure-sheets, as the issue says."
    meaning: >-
      A language's planar file changed since its planar Sheet was last
      updated (`sync-planar`, which also renumbers position numbers typed in
      answers). Resolve: run the command in the issue body (`update-sheets
      --apply` for additions, `restructure-sheets ... --apply` for moved,
      renamed or removed positions). Auto-closed when a later run finds no
      planar changes.
    filed_by: sync-planar (data-refresh.yml)

  - name: stale-class-sheets
    color: "E4E669"
    description: "Filed when the ID file has class sheets absent from diagnostics YAML; run retire-classes."
    meaning: >-
      Class sheets in the ID file have no matching class in `diagnostics_{lang}.yaml`.
      Resolve: `retire-classes --apply`. Auto-closed when clean.
    filed_by: data-refresh.yml

  - name: stale-manifest
    color: "E4E669"
    description: "Filed when the ID file has class sheets absent from diagnostics YAML; run retire-classes."
    meaning: >-
      What `stale-class-sheets` is now (#305 carries it).
    filed_by: data-refresh.yml
    retired: >-
      2026-10-30: renamed stale-class-sheets, with prune-manifest (now
      retire-classes), since the manifest was deleted in unit 11c-5

  - name: integrity-error
    color: "D93F0B"
    description: "Filed when integrity-check detects planar/analysis inconsistencies in data-refresh."
    meaning: >-
      `integrity-check` detected errors. Run `integrity-check` locally for
      details. Auto-closed when clean.
    filed_by: data-refresh.yml

  - name: dependent-stale
    color: "e4e669"
    description: "Dependent construction out of sync with its source; run generate-sheets --regen-construction."
    meaning: >-
      A dependent construction (e.g. nonpermutability `general`) is out of
      sync with its source (e.g. `element_prescreening`). Resolve:
      `generate-sheets --lang LANG --regen-construction CLASS:CONSTRUCTION`.
      Auto-closed when in sync.
    filed_by: data-refresh.yml

  - name: regen-dependents-error
    color: "d73a4a"
    description: "Filed when generate-sheets --regen-dependents fails to auto-regenerate a tab."
    meaning: >-
      `generate-sheets --regen-dependents` failed to regenerate a dependent
      tab (a real error, not `dependent-stale`, which needs a coordinator
      decision because annotation data already exists). Resolve: investigate
      the error, then re-run `generate-sheets --lang LANG_ID
      --regen-construction CLASS:CONSTRUCTION`. Auto-closed when clean.
    filed_by: data-refresh.yml

  - name: status-sheet-error
    color: "d73a4a"
    description: "The daily rebuild of the Annotation Status sheets failed; annotators see stale percentages."
    meaning: >-
      `generate-status-sheet --apply` failed during the daily refresh, so
      each language's status sheet still shows the previous run's
      percentages. The issue body has the failure output. Resolve: fix the
      cause, then run `python -m coding generate-status-sheet --apply`.
      Auto-closed when a later run succeeds.
    filed_by: data-refresh.yml

  - name: laminar-charts-error
    color: "d73a4a"
    description: "Contributor charts could not be drawn or put on Drive after the daily refresh."
    meaning: >-
      `laminar-charts --apply`, run after each daily refresh, could not draw
      or upload some languages' contributor charts, so their Drive folders
      still hold the previous ones. The issue names each language and the
      stage; the reason is left out (it can quote the annotation, and the
      repository is public), and the issue gives the command that shows it.
      Resolve: fix the cause, then run `python -m coding laminar-charts
      --apply`. Auto-closed when a run draws every language that needs it.
      Also filed by the workflow itself when a setup step (R, system
      libraries) fails before the command runs.
    filed_by: laminar-charts --apply (laminar-charts.yml)

  - name: chapter-behind
    color: "fbca04"
    description: "A chapter's data or code has moved on since the version it is built from."
    meaning: >-
      One issue per language chapter ("Chapter behind its data — {Name
      [glottocode]}"): the daily refresh built the chapter in
      planars-data's `.papers/` against today's annotation and code without
      moving its pinned data version, and something the chapter shows
      changed (spans, the planar structure, the diagnostics, the analysis,
      a generated file, or a `\claim` in its prose). The issue gives counts
      and the prose to reread, never the annotation (the repository is
      public). Resolve: run the command in the issue; or, to keep the
      chapter on its version for now, leave the issue open (it is rewritten
      in place, notifying nobody). Auto-closed when the chapter matches its
      data again.
    filed_by: build-chapters --check --apply (data-refresh.yml)

  - name: overleaf-sync
    color: "fbca04"
    description: "The chapters' Overleaf project needs a person: two edits met, or the sync failed."
    meaning: >-
      One issue ("Overleaf sync — chapters"): `sync-overleaf --apply` found
      a file in planars-data's `.papers/` changed both in Overleaf and in
      planars-data since the last sync, or a file the chapter build makes
      edited in Overleaf, and kept the other version as a copy under
      `conflicts/` (on both sides); or the sync failed. The issue names the
      files, never their text (the repository is public). Resolve: merge
      each copy into its file (in Overleaf or locally), delete the copy;
      for a failure, fix its cause. Rewritten in place while open;
      auto-closed when `conflicts/` is empty and the sync succeeds.
    filed_by: sync-overleaf --apply (data-refresh.yml)

  - name: collaborator-notes
    color: "0075ca"
    description: "Collaborator notes need coordinator triage. Review, file warranted issues, close."
    meaning: >-
      A collaborator's notes Doc has new content (one issue per annotator).
      Resolve: paste the Claude prompt from the issue body, review proposed
      issues, file warranted ones, then close this issue.
    filed_by: check-notes --apply (data-refresh.yml)

  - name: collaborator-comments
    color: "0075ca"
    description: "New or changed Comments cells need coordinator triage. Paste the prompt, review, close."
    meaning: >-
      An annotator wrote or changed a Comments cell in a class sheet (one
      issue per language, "Comments — {Name [glottocode]}"; a later run
      comments on it while it is open). Each comment is listed with its tab,
      row and answers. Resolve: paste the Claude prompt from the issue into a
      Claude Code session, which sorts the comments and drafts replies and
      issues for the coordinator to approve; then close this issue.
    filed_by: check-comments --apply (data-refresh.yml)

  - name: collaborator-check
    color: "e4e669"
    description: "In-progress sheet has anomalous changes; coordinator should verify with collaborator"
    meaning: >-
      An in-progress sheet has structural anomalies (missing rows, missing
      columns, >10% annotated-cell decrease). Not a blocking error — verify
      the change was intentional with the collaborator.
    filed_by: import-sheets

  - name: label-drift
    color: "fbca04"
    description: "A label in use on GitHub is missing from schemas/issue_labels.yaml"
    meaning: >-
      A label someone created on GitHub by hand is on issues but not in
      `schemas/issue_labels.yaml`, so the tooling can't keep it in line.
      Resolve: add it to the registry (or take it off those issues).
      Auto-closed when every label in use is registered.
    filed_by: issue --sync-labels --apply (data-refresh.yml)

  - name: audit
    color: "fbca04"
    description: "A project audit: due, or in progress"
    meaning: >-
      Filed when no audit issue has been closed for 30 days. The issue is the
      instruction: Claude runs the steps in `docs/coordinator-guide.md` §
      "Audit procedure", comments the findings and what was done about each,
      and closes it; the closing date is the date of the last audit.
    filed_by: daily-refresh --apply (data-refresh.yml)

  - name: door-violation
    color: "d93f0b"
    description: "A write broke a rule of the Drive door while it was only watching that kind of file"
    meaning: >-
      While the Drive door (`coding/drive_door.py`) is in watch mode for a
      kind of file, a write that breaks one of its rules still goes ahead,
      and the command files or updates this issue listing what broke. Each
      line is a bug in the command or a gap in the door's rules or spec.
      Resolve: fix whichever it is, then close. (The local-file door filed
      here too until it began refusing such writes, 2026-10-22.)
    filed_by: the Drive door, at the end of any watched command

  - name: sheet-updates
    color: "c5def5"
    description: "One per language: annotators subscribe to hear when that language's sheets change"
    meaning: >-
      One long-lived issue per language ("Sheet updates — {lang_id}");
      `restructure-sheets --apply` comments on it whenever that language's
      sheets get new URLs. Annotators subscribe to it. Never closed.
    filed_by: restructure-sheets --apply

  - name: planars-and-diagnostics
    color: "bfd4f2"
    description: "An annotator has suggested changes to a language's planar or diagnostics"
    meaning: >-
      One issue per language ("Changes suggested — {Name [glottocode]}
      planars and diagnostics"): the annotator's planars and diagnostics
      sheet differs from what it was filled with, and the issue lists each
      change in plain words, and any row both they and the coordinator
      changed (a conflict). Kept current by `proposal-sheets --apply` in the
      daily refresh. Resolve: `accept-proposal --lang LANG_ID --apply`, which
      closes it with the decisions; it also closes by itself when the sheet
      holds no suggested change. (Called `proposal` until 2026-10-24.)
    filed_by: proposal-sheets --apply (data-refresh.yml)
