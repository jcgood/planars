# Diagnostic Classes
# Normative schema for the linguistic content of analysis classes used in
# diagnostics_{lang_id}.tsv: what each class is, when it applies, and how it
# derives spans. Process/tracking state for the same classes (review status,
# whether collection is required, the sheet-facing instructions, the
# qualification_rule integrity hash) lives in schemas/diagnostic_classes_status.yaml
# instead — split out in Phase 3 of the data layer redesign (issue #271,
# docs/data-layer-implementation-plan.md) because the two move at different
# rates and a coordinator editing linguistic content had no way to touch it
# without also seeing (and risking touching) workflow bookkeeping in the same
# record. coding/schemas.py's load_diagnostic_classes() merges both files back
# into one dict per class at read time, so every reader of the merged result
# is unaffected by the split.
#
# THIS FILE IS THE SOURCE OF TRUTH FOR:
#   - Which analysis classes exist and what they cover
#   - When each class is applicable (universal vs. conditional)
#   - Whether a class uses one general construction or is construction-specific
#   - Which diagnostic criteria each class requires or allows
#   - Qualification rules: how spans are computed from criterion values for each class
#   - Known construction types (non-exhaustive examples for variable classes)
#
# THIS FILE IS NOT THE SOURCE OF TRUTH FOR:
#   - What each diagnostic criterion means linguistically or what values it accepts
#     → see schemas/diagnostic_criteria.yaml
#   - Definitions of span types and analytical terms (strict, loose, partial, complete)
#     → see schemas/terms.yaml
#   - Planar structure concepts (what positions, elements, keystone are)
#     → see schemas/planar.yaml
#   - Per-language instances of these classes
#     → see coded_data/{lang_id}/lang_setup/diagnostics_{lang_id}.tsv
#   - Review status, collection requirement, sheet instructions, or the
#     qualification_rule_hash integrity check for these classes
#     → see schemas/diagnostic_classes_status.yaml
#
# Relationship to other files:
#   schemas/diagnostic_criteria.yaml       — diagnostic criterion semantics and allowed values
#   schemas/diagnostic_classes.yaml (this) — class structure, applicability, qualification rules
#   schemas/diagnostic_classes_status.yaml — process/tracking state for the same classes
#   schemas/planar.yaml                    — planar structure ontology (positions, elements, columns)
#   schemas/terms.yaml                     — analytical vocabulary (strict/loose span, partial/complete)
#   diagnostics_{lang_id}.tsv              — per-language instance of these classes, validated against this file
#   docs/analyses.md                       — human reader's guide pointing to all schema files
#
# check-codebook validates diagnostics_{lang_id}.tsv against this file:
#   - required diagnostic criteria must be present as columns
#   - conditional classes should have applicability_conditions met
#   - construction names follow the naming rules for each specificity type
#
# Human-editable workflow: edit this file, then ask Claude to propagate changes
# to diagnostics_{lang_id}.tsv and scaffold any new analysis modules.
#
# Fields:
#   name                     machine name (matches planars/ module and coded_data/ folder;
#                            also the join key into diagnostic_classes_status.yaml)
#   display_name             human-readable label for notebook section headers
#   domain_type              morphosyntactic | phonological | indeterminate
#   domain_subtype           segmental | prosodic  (optional; phonological classes only)
#   applicability            universal | conditional
#   applicability_conditions prose description of when a conditional class applies
#   specificity              general | construction_specific
#   known_constructions      non-exhaustive examples (construction_specific classes only)
#   required_criteria        diagnostic criterion columns that must appear in diagnostics_{lang_id}.tsv for this class
#   optional_criteria        diagnostic criterion columns that may appear but are not required
#   keystone_active_default  true | false | "[NEEDS REVIEW]"
#                            Whether the keystone position (v:verbstem) is an active
#                            participant in this analysis class by default. true = the
#                            keystone is annotated with real criterion values and
#                            participates in span computation. false = the keystone is
#                            coded 'na' (criterion inapplicable). "[NEEDS REVIEW]" =
#                            the linguistic question is unresolved; treat as false until
#                            resolved. May be overridden per-language in
#                            diagnostics_{lang}.yaml (construction-level dict or class-
#                            level bool).
#   keystone_na_criteria     list of criterion names that must always be 'na' on the
#                            keystone row even when keystone_active is true. Used for
#                            self-referential criteria — e.g., 'independence' asks
#                            whether an element's stress is independent *of* the
#                            keystone, which is undefined for the keystone itself.
#                            Omit the field (or leave empty) when no such criteria exist.
#   constructions            Optional list of named constructions for classes that have
#                            internal construction dependencies (e.g., an element_prescreening tab
#                            that gates pair generation). Each entry may have:
#                              name             machine name (matches diagnostics_{lang}.yaml)
#                              row_type         element | pair_rows
#                              depends_on       name of the construction this depends on
#                              staleness_check  element_set (compare element sets to detect drift)
#                            Only needed for general-specificity classes with multi-stage
#                            workflows. construction_specific classes define constructions
#                            per-language in diagnostics_{lang}.yaml.
#
# Process/tracking fields that used to live on these same records — status,
# criterion_set_status, collection_required, qualification_rule_hash,
# sheet_instructions, include_planar_reference_tab — moved to
# schemas/diagnostic_classes_status.yaml; see that file's own header for field
# docs. A class's two-stage sheet workflow is documented in two places as a
# result: `constructions` here (the dependency structure) and
# `sheet_instructions` there (what to tell the annotator) — expect to open
# both files together when editing a multi-stage class like nonpermutability,
# coreference, or phrasal_accent.

classes:

  # ---------------------------------------------------------------------------
  # Morphosyntactic domain classes
  # ---------------------------------------------------------------------------

  - name: ciscategorial
    display_name: "Ciscategorial"
    domain_type: morphosyntactic
    applicability: universal
    applicability_conditions: >
      Applies to every verbal planar structure. All languages have elements that
      combine selectively with part-of-speech categories; the ciscategorial domain
      is the span of positions whose elements combine exclusively with verbs (as
      opposed to nouns or adjectives). NOTE: predicate-flexible languages (e.g.,
      Chorote ch. 15) allow non-verbal predicates to take "verbal" TAME markers,
      complicating the strict V-combines test. In such languages, fracture into
      "predicate-only ciscategorial" (strict) and "with-predicate ciscategorial"
      (elements that select predicates broadly) may be needed.
    specificity: general
    required_criteria: [V-combines, N-combines, A-combines]
    optional_criteria: [PRED-combines]  # predicate-flexible languages (e.g., Araona,
      # Chorote ch. 15) where non-verbal predicates take verbal TAME markers — issue #39.
    qualification_rule: >
      An element is v-ciscategorial if V-combines=y AND N-combines=n AND A-combines=n
      (and any further combine parameters are also n).
      A position is complete if ALL its elements are v-ciscategorial.
      A position is partial if AT LEAST ONE element is v-ciscategorial.
    keystone_active_default: false

  - name: subspanrepetition
    display_name: "Subspan Repetition"
    domain_type: morphosyntactic  # maximal (widescope) domain; per ch. 01 the minimal
    # (narrowscope/fillable) domain is classified as indeterminate in the book's taxonomy
    # because it is ambiguous between ellipsis (phonological) and gapping (morphosyntactic).
    applicability: conditional
    applicability_conditions: >
      Applicable when the language has constructions in which a contiguous subspan
      of the verbal planar structure repeats across two or more conjoined or embedded
      clauses (e.g., coordination, complementation, serial verb constructions, clause
      linkage). At least one such construction must be identifiable for annotation.
    specificity: construction_specific
    known_constructions:
      # Non-exhaustive examples. Add language-specific construction names as needed.
      # Asyndetic (no overt linker)
      - asyndetic coordination         # no overt marker; e.g., Chatino (primary strategy)
      - asyndetic juxtaposition        # verb complexes juxtaposed; e.g., Quechua
      - asyndetic clause combination   # e.g., Mocoví
      - asyndetic verb-verb linkage    # complement clause juxtaposition; e.g., Mixtec AVVL
      # Overt coordinators
      - and-coordination               # e.g., Araona, Mixtec ta, Chorote jla'yi ti/ka; subsumes right-node raising (RNR), which is recoded as and-coordination
      - or-coordination                # e.g., Mixtec an, Chorote ni'ne ti/ka
      - and-then clause linkage        # e.g., Mocoví kan
      - syndetic coordination          # overt coordinator; e.g., Chatino lóʔō
      # Subordination and embedding
      - complementation                # complement clause embedding
      - complement clause              # e.g., Yukuna -ka nominalization
      - complement subordination       # non-finite complement; e.g., Mebengokre =je
      - finite declarative complement clause   # e.g., Martinican
      - ña-linkage                     # complementizer subordination; e.g., Mixtec
      - syndetic clause linkage        # purpose/cause/concessive connector; e.g., Mixtec
      - adverbial clause               # e.g., Yukuna
      - purpose subordination          # e.g., Mebengokre kadjy
      # Clause chaining
      - clause linkage                 # e.g., Araona tso-clause linkage
      - same-subject clause chaining   # e.g., Yukuna, Mebengokre ne/=n
      - simultaneous clause chaining   # boundary suffix -yóʔ; e.g., Hup
      - sequential clause chaining     # boundary suffix -mɨʔ; e.g., Hup
      # Auxiliaries and causatives
      - auxiliary construction         # e.g., Araona auxiliary construction
      - lexical causative construction # minimal subspan; e.g., Mocoví
      # Reduplication and parallelism
      - total reduplication            # verb repeated in full; e.g., Mazatec
      - verbal parallelism             # same construction with different verb; e.g., Mazatec
      # Nominalization
      - nominalization                 # general nominalized clause; e.g., Mazatec
      - nominalized clause combination # gerundive/obligatative/habitual/prior-event; e.g., Quechua
      # Serial verbs
      - serial verb construction       # verb serialization; e.g., Hup
    required_criteria: [widescope_left, widescope_right, fillable_botheither_conjunct]
    optional_criteria: []
    qualification_rule: >
      Five span categories are derived:
        maximum_fillable:          fillable_botheither_conjunct=y
        maximum_widescope_left:    widescope_left=y
        maximum_widescope_right:   widescope_right=y
        maximum_narrowscope_left:  widescope_left=n  (element lacks wide scope left)
        maximum_narrowscope_right: widescope_right=n (element lacks wide scope right)
      Each category produces complete and partial position sets and four spans
      (strict/loose x complete/partial).
    keystone_active_default: false

  - name: noninterruption
    display_name: "Noninterruption"
    domain_type: morphosyntactic
    applicability: universal
    applicability_conditions: >
      Applies to every verbal planar structure. All languages have bound and free
      elements; the non-interruption domain tests which contiguous spans cannot be
      broken by free or multiply-occurring free elements.
    specificity: general
    required_criteria: [free, multiple]
    optional_criteria: []
    qualification_rule: >
      Two domain types, each with complete and partial position sets:
        no-free domain:     element qualifies if free=n (bound).
        single-free domain: element qualifies if free=n OR (free=y AND multiple=n).
      Only strict spans are computed for non-interruption (no loose span).
    keystone_active_default: false

  - name: nonpermutability
    display_name: "Nonpermutability"
    domain_type: morphosyntactic
    applicability: universal
    applicability_conditions: >
      Applies to every verbal planar structure. All languages have ordering constraints
      among verbal elements; the non-permutability domain tests the span over which
      linear ordering is strictly or conditionally fixed.
    specificity: general
    # Two-stage annotation (issue #116):
    #   First, element_prescreening: element-level sheet, scopal={y,n,both}.
    #     y = only scopally-conditioned variable orderings; n = no meaningful variable
    #     ordering (element filtered from pair sheet); both = mixed.
    #   Then the general construction: pair-row sheet (Element_A, Element_B, scopal={y,n}).
    #     Option C pairs, filtered to exclude pairs where either element has scopal=n
    #     in element_prescreening. Generate it only after that tab is imported.
    # Pairs not on the pair sheet are implicitly fixed-order by structural definition.
    constructions:
      - name: element_prescreening
        row_type: element
      - name: general
        row_type: pair_rows
        depends_on: element_prescreening
        staleness_check: element_set
        criterion: scopal
    keystone_active_default: true
    required_criteria: [scopal]
    optional_criteria: []
    qualification_rule: >
      Three span types (all strict — non-permutability domains are inherently
      contiguous). Qualification is evaluated per-position w.r.t. the keystone anchor.

      STRICT NON-PERMUTABLE SPAN (structurally derived; no annotation required):
        A position qualifies iff:
          (1) It is a Slot (Zones are always excluded).
          (2) All elements at that position appear in only one position in the planar
              (multi-slot elements have structurally variable order, so they cannot
              anchor a strictly fixed chain).
        The span is the largest contiguous chain of qualifying positions from the
        keystone outward; the first gap or non-qualifying position halts expansion.

      FREE-PERMUTABLE POSITION (blocking condition; derived from annotation):
        A position is free-permutable if ANY element at that position appears in a
        pair with scopal=n (freely variable order, no scope difference).
        An element appearing in both scopal=n and scopal=y pairs is treated as
        partially non-permutable; its position is free-permutable for the minimal
        span but may be interior in the maximal span.

      MINIMAL FLEXIBLE NON-PERMUTABLE SPAN:
        Extends the strict span outward through additional contiguous positions that
        are not free-permutable. No free-permutable positions appear anywhere in
        the span. Computed as strict_span(all_positions - free_permutable_positions).

      MAXIMAL FLEXIBLE NON-PERMUTABLE SPAN:
        Extends the minimal span outward through free-permutable interior positions,
        as long as the outermost (edge) positions of the span are not free-permutable.
        Computed by walking outward from keystone through all positions (including
        free-permutable), stopping only at structural gaps, and recording the outermost
        non-free-permutable position as the span edge.

  - name: coreference
    display_name: "Coreference"
    domain_type: morphosyntactic
    applicability: conditional
    applicability_conditions: >
      Applicable when the language has morphological reflexive voice marking on the
      verb, pronominal reflexive constructions, or reciprocal constructions where
      the binding domain can be operationalized as a set of position pairs. Languages
      with heavy argument incorporation or scrambling may yield ambiguous results —
      these are theoretically informative cases, not reasons to exclude the diagnostic.
    specificity: construction_specific
    known_constructions:
      - prescreening               # upstream prescreening: which elements are referential
      - reflexivization            # Principle A: reflexive_allowed=y/n (anaphors)
      - pronominalization          # Principle B: pronoun_allowed=y/n (pronouns)
      - np_reference               # Principle C: np_allowed=y/n (referring expressions)
      - morphological_reflexive_voice  # verb carries reflexive marker; keystone often bindee
      - reciprocal                 # reciprocal constructions
    # Two-stage workflow (mirrors nonpermutability):
    #   First, prescreening: standard element sheet; annotator marks
    #     referential=y/n for each element. Elements with n are excluded from pairs.
    #   Then the main construction: pair-row sheet; columns are Element_A, Position_A,
    #     Element_B, Position_B, Direction, <criterion>, Source, Comments.
    #     Element_A = antecedent (binder); Element_B = anaphor (bindee).
    constructions:
      - name: prescreening
        row_type: element
      - name: reflexivization
        row_type: pair_rows
        depends_on: prescreening
        staleness_check: element_set
        criterion: reflexive_allowed
      - name: pronominalization
        row_type: pair_rows
        depends_on: prescreening
        staleness_check: element_set
        criterion: pronoun_allowed
      - name: np_reference
        row_type: pair_rows
        depends_on: prescreening
        staleness_check: element_set
        criterion: np_allowed
    required_criteria: [reflexive_allowed]
    optional_criteria: [pronoun_allowed, np_allowed]
    qualification_rule: >
      Prescreening: elements are annotated referential=y (can participate as binder
      or bindee in this construction) or =n (cannot). Only referential elements generate pair rows.

      Each pair row (Element_A, Position_A, Position_B) represents a potential coreference
      relation where Element_A is the antecedent (binder) at Position_A, and Position_B is
      the structural position of the anaphor (bindee). The annotator marks reflexive_allowed=y
      if the construction exhibits anaphoric binding for this pair, or =n.

      Binder positions: the set of positions for Element_A across all pairs with reflexive_allowed=y.
      Bindee positions: the set of Position_B values across all pairs with reflexive_allowed=y.

      BINDER DOMAIN (strict): contiguous expansion from keystone through binder positions.
      BINDER DOMAIN (loose):  leftmost to rightmost binder position (gaps allowed).
      BINDEE DOMAIN (strict): contiguous expansion from keystone through bindee positions.
      BINDEE DOMAIN (loose):  leftmost to rightmost bindee position (gaps allowed).

      Asymmetry (secondary output):
        Binder-only positions (structurally high): appear as binder position but not bindee position.
        Bindee-only positions (structurally low):  appear as bindee position but not binder position.
        Shared positions (either role):            appear in both sets.
      The asymmetry between binder-only and bindee-only positions approximates c-command
      without presupposing tree structure (see issue #163).
    keystone_active_default: true
    # Keystone (verb) is the natural bindee in morphological reflexive voice constructions.

  - name: free_occurrence
    display_name: "Free Occurrence"
    domain_type: indeterminate
    applicability: universal
    applicability_conditions: >
      Applies to every verbal planar structure. All languages have free and bound
      elements; the free occurrence domain identifies the span of positions that can
      contain a single free form. Classified as indeterminate because free occurrence
      straddles morphosyntactic and phonological criteria (Tallman et al. 2024, ch. 1).
    specificity: general
    required_criteria: [free, left-edge-of-free-form, right-edge-of-free-form, dependent-on-left, dependent-on-right]
    # free is pre-filled from noninterruption/general.tsv at sheet generation time.
    # All annotation columns (left-edge-of-free-form, right-edge-of-free-form,
    # dependent-on-left, dependent-on-right) apply to bound elements (free=n) only;
    # free elements (free=y) receive na in all annotation columns. See issue #99.
    qualification_rule: >
      A position is free-occurrence-internal if ANY of the following hold:
        1. It is to the left of the anchor (keystone) and left-edge-of-free-form=y for
           at least one element.
        2. It is to the right of the anchor and right-edge-of-free-form=y for at least
           one element.
        3. At least one of its elements has dependent-on-left or dependent-on-right
           referencing the anchor's position number.

      Maximal free occurrence span = leftmost to rightmost free-occurrence-internal
      position.

      Minimal free occurrence span:
        - If the keystone element is free (free=y): the span is the keystone position
          alone (the single-free-form utterance is just the anchor).
        - If the keystone is bound (free=n): the span is determined by the positions the
          keystone depends on (dependent-on-left, dependent-on-right), since the keystone
          requires those positions in order to be realized.

      Note: Adam Tallman (2026-04-24, issue #99) confirmed that all annotation columns
      (left-edge-of-free-form, right-edge-of-free-form, dependent-on-left,
      dependent-on-right) apply only to bound elements (free=n); free elements (free=y)
      receive na in all annotation columns.
    keystone_active_default: true
    keystone_na_criteria: [left-edge-of-free-form, right-edge-of-free-form, dependent-on-left, dependent-on-right]

  - name: proform
    display_name: "Proform"
    domain_type: morphosyntactic
    applicability: conditional
    applicability_conditions: >
      Applicable when the language has proforms (pronouns, pro-verbs, pro-VP substitutes,
      etc.) that can replace a contiguous span within the verbal planar structure. The
      proform domain is the span the proform substitutes for.
    specificity: construction_specific
    required_criteria: [shareable_proform_replace]
    optional_criteria: []
    known_constructions: [do_so_substitution, vp_ellipsis]
    qualification_rule: >
      Two-tier qualification. Strict (complete) qualification: ALL elements in the
      position have shareable_proform_replace=y. Loose (partial) qualification: at
      least one element has shareable_proform_replace=y or shareable_proform_replace=both.
      Positions where all elements are n do not qualify. Strict span uses complete
      positions; loose span uses partial positions (which subsumes complete).
    keystone_active_default: false

  - name: idiom
    display_name: "Idiom"
    domain_type: morphosyntactic
    applicability: conditional
    applicability_conditions: >
      Applicable when the language has idiomatic expressions within the verbal planar
      structure — collocations of verbal elements whose combined meaning is not
      compositionally predictable from the individual elements. One construction per TSV.
    specificity: construction_specific
    known_constructions:
      # One TSV per idiomatic collocation. Names should describe the idiom briefly.
      - verb-particle idiom
      - verb-affix collocation
    required_criteria: [idiomatic]
    optional_criteria: []
    qualification_rule: >
      A position qualifies if it contains an element where idiomatic=y. Complete
      qualification: ALL elements have idiomatic=y. Partial qualification: at
      least one element has idiomatic=y.
    keystone_active_default: false

  - name: biuniqueness_exponence
    display_name: "Biuniqueness — extended exponence"
    domain_type: indeterminate
    applicability: conditional
    applicability_conditions: >
      Applicable when the language has circumfixes (morphemes discontinuous across
      two positions) or extended exponents (the same morphosyntactic feature expressed
      by morphs in multiple positions). The biuniqueness domain is the span from the
      leftmost piece of the discontinuous morpheme to the rightmost. Each circumfix
      or extended exponent group is annotated in its own TSV. Classified as indeterminate
      (Tallman et al. 2024).
      NOTE: Biuniqueness — a one-to-one match between form and meaning — can fail in
      two directions, and this class covers only one of them: extended exponence, where
      one meaning is carried by several pieces at once in different positions (e.g.
      Araona pi-...-ma). The other is non-automatic allomorphy (TAM-conditioned
      suppletion, inflectional-class allomorphy, valency allomorphy, etc.), where one
      meaning is carried by different forms depending on context — confirmed across many
      languages: Zapotec (ch. 07), Yukuna (ch. 11), Kiowa (ch. 04), Mixtec (tonal
      inflection classes), Chatino (TAM tonal alternations), Chorote (causative/
      antipassive allomorphy), Mocoví (3rd-person prefix sets) — see issue #58.
      Allomorphy is not a class here: it is being screened first via
      coding/generate_biuniqueness_allomorphy_stage1_sheet.py, and how it feeds a span
      is still open (issue #254 Part 2i). This class was named plain "biuniqueness"
      until 2026-08-02, which read as if it covered the family rather than one member.
    specificity: construction_specific
    known_constructions:
      # One TSV per discontinuous morpheme or extended exponent group.
      - negation circumfix       # e.g., Araona pi-...-ma
      - interactional circumfix  # e.g., Araona ja-...-ti
      - perfective circumfix
      - extended exponent
    required_criteria: [biunique]
    optional_criteria: []
    qualification_rule: >
      A position qualifies if it contains an element where biunique=n. Complete
      qualification: ALL elements in the position have biunique=n. Partial
      qualification: at least one element has biunique=n. The loose partial span
      is the most semantically informative: it extends from the position of the
      prefixal piece to the position of the suffixal piece, directly identifying
      the extended exponent domain.
    keystone_active_default: false

  - name: repair
    display_name: "Repair"
    domain_type: phonological
    applicability: conditional
    applicability_conditions: >
      Applicable when elicitation can test repair/restart behavior — i.e., when speakers
      can be prompted to make production errors within the verbal complex and their restart
      behavior reveals a coherent span. The repair domain is the minimal span such that an
      error anywhere inside it triggers restart from the left edge.
    specificity: general
    required_criteria: [restart]
    optional_criteria: []
    qualification_rule: >
      A position qualifies if it contains an element where restart=y. Complete
      qualification: ALL elements in the position have restart=y. Partial
      qualification: at least one element has restart=y.
    keystone_active_default: "[NEEDS REVIEW]"  # Unclear whether the verbstem participates
      # in repair/restart behavior. Treat as false until Adam resolves.

  - name: metrical
    display_name: "Metrical"
    domain_type: phonological
    domain_subtype: prosodic
    applicability: conditional
    applicability_conditions: >
      Applicable when the language has a metrical or prosodic domain in the verbal
      complex that is defined by accent or stress — a boundary-defined domain where
      the domain expands from the keystone until an independently or obligatorily
      accented position creates a boundary. One construction per TSV.
    specificity: construction_specific
    known_constructions:
      - stress_domain          # boundary-defined stress domain; e.g., English, stan1293
    required_criteria: [accented, obligatory, independence]
    optional_criteria: [left-interaction, right-interaction]
    qualification_rule: >
      Blocked-span path (accented/obligatory/independence criteria):
        Expand from keystone in each direction, stopping just before the first
        position where the blocking condition holds.

        Minimal metrical domain — blocked by: accented ∈ {y, both} AND independence = y.
          An independently-accented element begins a new metrical domain; the minimal
          domain ends just before it.

        Maximal metrical domain — blocked by: obligatory = y AND independence = y.
          An obligatorily-independent element creates a hard boundary.

        The keystone always remains part of the domain. Its criterion values
        participate in blocking checks but it is never excluded from the span.
        Returns minimal/maximal × partial/complete = 4 blocked spans.
    keystone_active_default: true  # The verbstem has real stress/accent properties
      # (accented, obligatory, independence) that participate in the blocked-span
      # boundary computation. Keystone rows must be annotated with real values.
    keystone_na_criteria: [independence]  # 'independence' asks whether an element's
      # stress is independent *of* the keystone — a self-referential question for the
      # keystone itself. It is always 'na' on the keystone row even when
      # keystone_active is true.

  - name: phrasal_accent
    display_name: "Phrasal (Pitch) Accent Grouping"
    domain_type: phonological
    applicability: conditional
    applicability_conditions: >
      Applicable when the language has a stress-accent or pitch-accent system where
      individual accent-bearing elements can group together under a single phrasal
      pitch accent (one element's accent subordinates to a neighboring element's,
      rather than each retaining an independent accent). See issue #237.
    specificity: general
    # Two-stage annotation (issue #237):
    #   First, the prescreening construction: element-level sheet, reuses the existing
    #     `accented` criterion (y/n/both) from the metrical class as-is — restricts the
    #     candidate pair set to accent-eligible elements. Elements coded accented=n are
    #     excluded from pairing (they can never independently host a pitch
    #     accent, so their combination behavior is trivial by definition).
    #     By explicit coordinator decision (2026-07-28): prescreening applies to every
    #     planar element — category placeholders (e.g. NP{S,A}) and specific
    #     non-category elements (e.g. individual pronouns) alike — rather than
    #     restricting to formative-level elements only. This intersects with the open
    #     question in issue #239 (elements conflate multiple levels of representation);
    #     this class proceeds inclusively for now rather than waiting on that resolving,
    #     and the resulting data is itself a concrete test case for #239's question of
    #     whether category-level judgments behave differently from formative-level ones.
    #   Then the general construction: pair-row sheet (Element_A, Element_B,
    #     joint_accent={always,sometimes,never}), restricted to accent-eligible ×
    #     accent-eligible pairs surviving prescreening.
    #   Domain/span derivation from joint_accent data is deliberately deferred — the
    #   coordinator wants the coding scheme validated against real data before
    #   committing to a derivation method (interval-consistency vs. graph-based were
    #   both discussed; neither has been chosen). See issue #237 discussion.
    constructions:
      - name: prescreening
        row_type: element
      - name: general
        row_type: pair_rows
        depends_on: prescreening
        staleness_check: element_set
        criterion: joint_accent
    required_criteria: []  # empty because criteria are construction-specific (mirrors
      # segmental's pattern): prescreening uses accented, general uses joint_accent --
      # neither is required on every row/construction of this class, so both go in
      # optional_criteria instead, declared via construction_criteria in
      # diagnostics_{lang_id}.yaml. required_criteria is checked uniformly per TSV
      # row by check-codebook, which would incorrectly flag prescreening rows as
      # missing joint_accent (and vice versa) if either were required here.
    optional_criteria: [accented, joint_accent]
    qualification_rule: >
      [DEFERRED — issue #237] Domain/span derivation from joint_accent pairwise data
      has not been decided yet; the coordinator wants the coding scheme validated
      against real data first. No spans are computed by this class until a derivation
      method is chosen and this rule is filled in. No planars/phrasal_accent.py module
      exists yet for the same reason — writing derivation logic ahead of that decision
      would just be thrown away or risk becoming a silently-wrong default.
    keystone_active_default: true  # Mirrors metrical: the verbstem has real
      # accentuation properties that plausibly participate in phrasal grouping.
      # Tentative pending the deferred qualification rule.

  - name: segmental
    display_name: "Segmental"
    domain_type: phonological
    domain_subtype: segmental
    applicability: conditional
    applicability_conditions: >
      Applicable when the language has a segmental phonological process (vowel deletion,
      consonant coalescence, nasality spreading, palatalization, aspiration, etc.) that
      applies within a defined span of the verbal planar structure. One process per TSV.
      Multiple segmental processes may identify different spans.
    specificity: construction_specific
    known_constructions:
      # One TSV per segmental process. Non-exhaustive examples.
      # Each construction uses its own criteria (see construction_criteria in
      # diagnostics_{lang_id}.yaml); criteria are NOT shared across constructions.
      - aspiration_prominence          # prosodically conditioned aspiration; criterion: aspirated; e.g., English
      - aspiration_fusion              # aspiration-related segmental process; criterion: aspirated; e.g., Yukuna ch. 11
      - flapping                       # flapping domain (t/d→ɾ); criteria: flapping_left, flapping_internal, flapping_right; e.g., English
      # Vowel processes
      - vowel syncope domain           # e.g., Araona: vcore-tamesuf
      - vowel elision domain           # hiatus resolution; e.g., Chatino verbal prefix domain
      - vowel fusion domain            # pronoun vowel fusion; e.g., Chatino pos. 13-17
      - vowel overwriting domain       # CVʔV + vowel-initial pronoun; e.g., Mixtec
      - vowel copying domain           # morphophonological copying; e.g., Hup
      - vowel deletion domain          # e.g., Cherokee
      - vowel lowering domain          # /u,i/→[o,e] near /q/; e.g., Quechua
      - vowel harmony domain           # verb- or affix-conditioned harmony; e.g., Mocoví
      - vocalic epenthesis domain      # cluster resolution; e.g., Mocoví
      - echo vowel epenthesis domain   # stem-final epenthesis; e.g., Mebengokre
      - syncope domain                 # high-vowel deletion in prefixed stems; e.g., Mebengokre
      - suffix deletion domain         # function word final-syllable deletion; e.g., Quechua
      - yod insertion domain           # /y/ epenthesis at vowel juncture; e.g., Chorote
      # Consonant processes
      - consonant coalescence domain   # e.g., Cup'ik uvular-velar: vbase-pn4
      - final consonant deletion domain  # coda deletion at suffix boundary; e.g., Hup
      - h-metathesis domain            # e.g., Cherokee
      - final apocope domain           # e.g., Cherokee
      # Spreading / assimilation
      - nasality spreading domain      # e.g., Chatino: positions 13-17
      - palatalization domain          # e.g., Chatino coronal, Chorote, Mocoví
      - fortition domain               # palatal fortition; e.g., Mebengokre aj-verb
    # required_criteria is empty because criteria are construction-specific: each
    # construction listed in known_constructions uses its own criterion set (declared
    # via construction_criteria in diagnostics_{lang_id}.yaml).  All known criteria
    # are listed in optional_criteria so check-codebook can validate them when present.
    required_criteria: []
    optional_criteria: [aspirated, flapping_left, flapping_internal, flapping_right]
    qualification_rule: >
      Construction-specific positive-qualification path:

        Each construction declares its own criteria via construction_criteria in
        diagnostics_{lang_id}.yaml. An element qualifies when ALL of its
        construction's criteria are in {y, both}:

        Single-criterion constructions (e.g. aspiration_prominence):
          aspirated ∈ {y, both} → element qualifies.

        Multi-criterion chain constructions (e.g. flapping):
          ALL of flapping_left, flapping_internal, flapping_right ∈ {y, both}
          → element qualifies (the flapping chain is unbroken at this element).
          n or na at any criterion breaks the chain.

        both counts as qualifying in all cases: it indicates variable application
        of the process. The strong/weak distinction (y-only vs y/both) is latent
        in the annotation data and can be derived analytically.

        Complete: ALL elements in the position qualify.
        Partial: at least one element qualifies.
        Returns four spans (strict/loose × complete/partial).
    keystone_active_default: true

  - name: tonal
    display_name: "Tonal"
    domain_type: phonological
    domain_subtype: tonal
    applicability: conditional
    applicability_conditions: >
      Applicable when the language has a general tonal phonological process (spreading,
      assignment, or sandhi) that applies within a defined span of the verbal planar
      structure but is NOT a tonosegmental overlay (i.e., not a tonal melody assigned to
      a segmental span as the surface realisation of a grammatical or semantic feature —
      those belong in tonosegmental). Examples include tonal spreading rules and tonal
      assignment rules conditioned by morphological or phonological environment.
      One rule per TSV.
    specificity: construction_specific
    known_constructions:
      # One TSV per tonal rule. Non-exhaustive examples.
      - H1-spreading domain       # e.g., Cherokee: pos. 11-21
      - H3-assignment domain      # e.g., Cherokee: pos. 5/7-21
    required_criteria: [applies]
    optional_criteria: []
    qualification_rule: >
      A position qualifies if it contains an element where applies=y. Complete
      qualification: ALL elements in the position have applies=y. Partial
      qualification: at least one element has applies=y. Returns four spans
      (strict/loose × complete/partial).
    keystone_active_default: "[NEEDS REVIEW]"

  - name: tonosegmental
    display_name: "Tonosegmental"
    domain_type: phonological
    domain_subtype: tonal
    applicability: conditional
    applicability_conditions: >
      Applicable when the language has a tonal melody assigned to a segmental span
      as the surface realisation of a grammatical or semantic feature (e.g., a TAM
      category, agreement feature, or lexical distinction). The domain is the span
      over which the melody applies. Distinct from tonal.py, which covers general
      tonal phonological processes (spreading, sandhi) not tied to a specific
      morphological exponent. One melody per TSV.
    specificity: construction_specific
    known_constructions:
      # One TSV per tonal melody. Non-exhaustive examples.
      - tone melody domain        # e.g., Chatino TAM tonal alternations: pos. 10-13
      - superhigh-assignment domain  # e.g., Cherokee: pos. 5/7-22
    required_criteria: [applies]
    optional_criteria: []
    qualification_rule: >
      A position qualifies if it contains an element where applies=y. Complete
      qualification: ALL elements in the position have applies=y. Partial
      qualification: at least one element has applies=y. Returns four spans
      (strict/loose × complete/partial).
    keystone_active_default: "[NEEDS REVIEW]"

  - name: intonational
    display_name: "Intonational"
    domain_type: phonological
    domain_subtype: prosodic
    applicability: conditional
    applicability_conditions: >
      Applicable when the language has an intonational phonological pattern (boundary
      tone, pitch reset, declination, etc.) with a positively delimited domain in the
      verbal planar structure. Distinct from tonosegmental (tonal melody overlays
      encoding grammatical features) and tonal (general tonal spreading/assignment).
      One pattern per TSV.
    specificity: construction_specific
    known_constructions: []
    required_criteria: [applies]
    optional_criteria: []
    qualification_rule: >
      A position qualifies if it contains an element where applies=y. Complete
      qualification: ALL elements in the position have applies=y. Partial
      qualification: at least one element has applies=y. Returns four spans
      (strict/loose × complete/partial).
    keystone_active_default: "[NEEDS REVIEW]"

  - name: pausing
    display_name: "Pausing"
    domain_type: phonological
    domain_subtype: prosodic
    applicability: conditional
    applicability_conditions: >
      Applicable when pausability can be elicited — i.e., when speakers' judgments or
      natural behavior reveal a span within which prosodic pause insertion is blocked.
      The pausing domain is a span that constitutes a pause unit; elements outside it
      permit pause insertion.
    specificity: general
    required_criteria: [pause_domain]
    optional_criteria: []
    qualification_rule: >
      A position qualifies if it contains an element where pause_domain=y.
      Complete qualification: ALL elements in the position have pause_domain=y.
      Partial qualification: at least one element has pause_domain=y.
    keystone_active_default: "[NEEDS REVIEW]"

  - name: play_language
    display_name: "Play Language"
    domain_type: phonological
    applicability: conditional
    applicability_conditions: >
      Applicable when the language has documented play language (ludling) phenomena —
      operations such as infixation, element reversal, or metathesis that target a
      defined span of the verbal planar structure. Currently attested in Zenzontepec
      Chatino (ch. 8). One operation type per TSV.
    specificity: construction_specific
    known_constructions:
      # One TSV per ludling operation type.
      - infixation ludling
      - element reversal
      - syllable metathesis
      - initial-syllable transposition  # initial CV moved to end of form; e.g., Chatino (ch. 8);
                                        # each lexical tone melody domain is its own target;
                                        # compound verb stems each transpose independently
    required_criteria: [applies]
    optional_criteria: []
    qualification_rule: >
      A position qualifies if it contains an element where applies=y. Complete
      qualification: ALL elements have applies=y. Partial qualification: at
      least one element has applies=y.
    keystone_active_default: "[NEEDS REVIEW]"
