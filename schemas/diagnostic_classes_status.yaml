# Diagnostic Classes — status
# Process/tracking state for the analysis classes defined in
# schemas/diagnostic_classes.yaml, split out from that file in Phase 3 of the
# data layer redesign (issue #271, docs/data-layer-implementation-plan.md).
# The two files move at different rates: diagnostic_classes.yaml is a
# linguistic claim (revised as the analysis itself changes), this file is
# workflow bookkeeping (revised as annotation/review progresses). Before the
# split both lived in one record per class, so touching the linguistic
# content of a class meant scrolling past its review status and vice versa.
#
# THIS FILE IS THE SOURCE OF TRUTH FOR:
#   - Review status of each class (status, criterion_set_status)
#   - Whether a class must be collected for every language (collection_required)
#   - The integrity hash proving a module's code was checked against its
#     span_rule text (span_rule_hash — see
#     coding/sync_span_rule_hashes.py, the only writer)
#   - Annotator-facing guidance shown on the generated Instructions tab
#     (sheet_instructions)
#   - Whether generate-sheets adds a planar reference tab for a class
#     (include_planar_reference_tab)
#
# THIS FILE IS NOT THE SOURCE OF TRUTH FOR:
#   - What a class covers, when it applies, or how it derives spans
#     → see schemas/diagnostic_classes.yaml
#
# Each entry is keyed by `name`, matching a class name in
# schemas/diagnostic_classes.yaml. coding/schemas.py's load_diagnostic_classes()
# merges the two files by name at read time; every existing reader of that
# function's return value sees the same combined shape as before this split
# and needs no change.
#
# Fields:
#   name                        join key; matches a `name` in diagnostic_classes.yaml
#   status                      stable | "[NEEDS REVIEW]" | "[PLACEHOLDER]" |
#                               "[AUTO-DERIVED]" (only a coordinator may promote a
#                               class out of "[AUTO-DERIVED]" or "[NEEDS REVIEW]" to
#                               stable — see CLAUDE.md § Conventions, "Analysis status")
#   criterion_set_status        stable | "[PROVISIONAL]" (expected to grow as more
#                               languages are analyzed; note explains known gaps or
#                               open questions)
#   collection_required         "[NEEDS COORDINATOR INPUT]" until coordinator decides;
#                               "y" = must appear in diagnostics_{lang_id}.tsv for every
#                               language; "n" = optional (conditional on language-specific
#                               phenomena)
#   span_rule_hash              SHA-256[:8] of the whitespace-normalised
#                               span_rule text in diagnostic_classes.yaml.
#                               Stamped by `python -m coding sync-span-rule-hashes
#                               --apply` after a module has been checked against the
#                               current rule text; drift means the code has not been
#                               re-verified since the rule last changed.
#   sheet_instructions           Optional free-text guidance for the Instructions tab
#                               (a locked tab, rebuilt daily — schemas/planar.yaml
#                               locked_tabs). Written for annotators (John-level).
#                               If absent, only generic dependency-order
#                               instructions are shown.
#   module_pending              Optional; the issue tracking a class collected before
#                               its planars/ module exists (e.g. "#237"). Silences the
#                               daily "no analysis module" warning; check-codebook
#                               errors once the module exists and this is still set.
#   include_planar_reference_tab  Optional; true adds the locked Planar Structure
#                               reference tab to the class's spreadsheet (named as
#                               its opt_in_field in schemas/planar.yaml locked_tabs;
#                               built by coding/locked_tabs.py).

classes:

  # ---------------------------------------------------------------------------
  # Morphosyntactic domain classes
  # ---------------------------------------------------------------------------

  - name: ciscategorial
    span_rule_hash: "eefbef19"
    status: stable
    collection_required: "y"
    criterion_set_status: "[PROVISIONAL]"  # Criterion set may grow further as more
      # predicate-flexible languages are onboarded; other *-combines types not yet attested.

  - name: subspanrepetition
    span_rule_hash: "82a6a7c2"
    status: stable
    collection_required: "y"
    criterion_set_status: "[PROVISIONAL]"  # Construction types are open-ended and expected
      # to grow as more languages are added. Criterion names may also need refinement as
      # additional construction types are attested.

  - name: noninterruption
    span_rule_hash: "c82f3b70"
    status: stable
    collection_required: "y"
    criterion_set_status: stable

  - name: nonpermutability
    sheet_instructions: >
      STEP 1 — element_prescreening: For each element, annotate scopal with one value:
        y    = this element always participates in fixed-order (scopally meaningful) pairs
        n    = this element has no meaningful variable ordering; it will be EXCLUDED from
               the pair list in Step 2
        both = this element has mixed behavior: some pairs are scopal, some are freely variable
      When finished, mark element_prescreening as "ready-for-review" in the Status tab.
      The coordinator will then regenerate the general tab with a filtered pair list.

      STEP 2 — general: Do NOT annotate this tab until the coordinator confirms it has been
      regenerated after Step 1 is complete. Once regenerated, annotate each pair:
        scopal = y  means these two elements must appear in a fixed order (the order
                    carries an obligatory scope difference)
        scopal = n  means these two elements can appear in either order freely (no
                    scope difference)
    span_rule_hash: "ebe680ca"
    criterion_set_status: stable
    status: "[AUTO-DERIVED: NEEDS REVIEW — span rule redesigned Apr 2026 (issue
      #116) to use pair-row annotation. Previous 4-span model (permutable/scopal per
      element) replaced by 3-span model (scopal per pair; strict span now structurally
      derived). Coordinator sign-off needed before promoting to stable.]"
    collection_required: "y"
    include_planar_reference_tab: true

  - name: coreference
    sheet_instructions: >
      STEP 1 — prescreening: For each element, annotate referential:
        y = this element is a referential expression (NP, pronoun) that can enter coreference
        n = this element cannot participate; it will be EXCLUDED from the pair list in Step 2
      When finished, mark prescreening as "ready-for-review" in the Status tab.
      The coordinator will then regenerate each pair construction tab from the prescreening results.

      STEP 2 — (pair constructions): Do NOT annotate until the coordinator confirms regeneration.
      The coordinator runs:
        python -m coding generate-sheets --lang LANG_ID --regen-construction coreference:CONSTRUCTION_NAME
      Each row (Element_A, Position_A, Position_B, Direction) represents a potential
      antecedent-anaphor pair. Position columns use "N (name)" format e.g. "5 (v:npsubj1)".
      For reflexive_coreference: mark reflexive_allowed=y if a reflexive at Position_B can be
                             bound by Element_A at Position_A; n if it cannot. (Principle A)
      For pronoun_coreference:   mark pronoun_allowed=y if a non-reflexive pronoun at Position_B
                             can be bound by Element_A at Position_A; n if it cannot. (Principle B)
      For np_coreference:        mark np_allowed=y if an NP at Position_B can corefer with
                             Element_A at Position_A; n if it cannot. (Principle C)
    span_rule_hash: "96a13eba"
    status: "[AUTO-DERIVED: NEEDS REVIEW — proposed in issue #163 (Apr 2026). Pair-row
      operationalization of binder/bindee domains with reflexive_allowed=y/n criterion and
      upstream prescreening (referential=y/n) stage. Coordinator sign-off required before
      promoting to stable.]"
    criterion_set_status: "[NEEDS REVIEW]"
    collection_required: "[NEEDS COORDINATOR INPUT]"
    include_planar_reference_tab: true

  - name: free_occurrence
    span_rule_hash: "29aba0bb"
    status: "[AUTO-DERIVED]"
    collection_required: "y"
    criterion_set_status: stable

  - name: proform
    span_rule_hash: "905b8468"
    criterion_set_status: "[NEEDS REVIEW]"  # Criterion design confirmed by Adam Tallman
      # (May 2026); not yet validated against annotation data.
    status: "[NEEDS REVIEW]"  # Ch. 17 line 543 explicitly states proform was NOT included in
    # the published database: "There are other tests that have not yet been included in the
    # database (e.g. proform replacement)." Criterion design confirmed; annotation for
    # stan1293 do_so_substitution in progress.
    collection_required: "y"

  - name: idiom
    span_rule_hash: "9ac4e824"
    criterion_set_status: stable  # Single binary criterion is appropriate; idiom identity
      # is encoded in the construction name, not additional parameters.
    status: "[NEEDS REVIEW]"  # Mebengokre (ch. 12) provides the clearest evidence: diagnostic
    # [\ref{idioms}] documents 3 specific idioms with position spans (adjnc-ket). The class
    # design is sound but needs annotation data.
    collection_required: "n"

  - name: biuniqueness_deviations
    span_rule_hash: "cf30f7b6"
    criterion_set_status: "[PROVISIONAL]"  # Designed 2026-10-11 (#254) and not yet
      # run on real annotation; columns may change once Adam fills the morphs tab.
    status: "[AUTO-DERIVED]"  # Span definition and deviation-type rules designed with
    # the coordinator on 2026-10-11; awaiting Adam's review (#254). Replaces
    # biuniqueness_exponence (no language had data for it) and the standalone
    # allomorphy screening sheet. Book support: ch. 17 calls biuniqueness
    # "relatively superficially considered", with "a great deal of complexity and
    # variation hidden behind such designations".
    collection_required: "[NEEDS COORDINATOR INPUT]"
    include_planar_reference_tab: true
    sheet_instructions: >
      Three tabs, filled in order. Each later tab is generated from your answers
      in the one before, so finish a tab and mark it ready-for-review in the
      Status tab before starting the next.

      ELEMENTS. One row per element at each position.
      For a specific form (be, do, -ed): set has_allomorphs to y or n. If y, list
      the element's variant forms in members, separated by commas (be: am, are,
      is). Contracted forms count ('ll, 'd, 've).
      For a whole word class written in capitals (like AD-S), has_allomorphs is
      already NA; leave it. In members, list only words in that class you
      already know or suspect have variant forms. Leave it blank if you don't
      know of any: blank means "none known", not "none exist".
      co_exponents: if this element expresses its meaning together with an
      element at another position at the same time, name that position (be at
      v:progressive goes with -ing at v:verbinflection). Otherwise leave blank.

      MORPHEMES. One row per morpheme found on the elements tab.
      forms_relation: alternate if its forms replace one another (do / does),
      co-occur if they appear together (be ... -ing). morpheme_class: optional
      name for a shared pattern (ablaut_i_a_u).

      MORPHS. One row per form at each position, already filled in for you.
      occurs_here: y or n. n is a finding, not a mistake: 'll never appears on a
      fronted will. For each y row: conditioning_type (phonological,
      morphosyntactic, lexico-constructional or prosodic); conditioning_features
      (what selects this form, e.g. tense=past, or 'elsewhere' for the default
      form); conditioned_by (the position or positions whose content selects
      it); trigger_filled (y if that position is filled when this form appears,
      n if it is left empty because this form carries that meaning itself, as
      went leaves the -ed slot empty).

  - name: repair
    span_rule_hash: "7c734731"
    criterion_set_status: stable  # Single binary criterion is appropriate; restart
      # behavior is categorical (yes/no per position).
    status: "[NEEDS REVIEW]"  # Strongly confirmed by Cup'ik ch. 2 (4 naturalistic examples,
    # restart domain = vbase–pn4); no evidence in 8 other reviewed chapters. Applicable
    # only where elicitation can target production errors within the verbal complex.
    collection_required: "n"

  # ---------------------------------------------------------------------------
  # Phonological domain classes
  # ---------------------------------------------------------------------------

  - name: metrical
    span_rule_hash: "56e9aeb2"
    criterion_set_status: "[PROVISIONAL]"  # left-interaction and right-interaction are
      # [NEEDS REVIEW] — their role in the blocked-span rule is unresolved
      # (issue #17). May be removed, renamed, or replaced depending on resolution of
      # meso/interaction domain design (issues #16, #17).
    status: stable  # Note: left-interaction and right-interaction are [NEEDS REVIEW] (issue #17)
    collection_required: "n"


  - name: phrasal_accent
    sheet_instructions: >
      STEP 1 — prescreening: For each element, annotate accented (same criterion
      metrical uses):
        y    = this element can always independently carry a phrasal pitch accent
        n    = this element can never independently carry a phrasal pitch accent;
               it will be EXCLUDED from the pair list in Step 2
        both = variably accent-bearing depending on context
      When finished, mark prescreening as "ready-for-review" in the Status tab.
      The coordinator will then regenerate the general tab with a filtered pair list.

      STEP 2 — general: Do NOT annotate this tab until the coordinator confirms it has
      been regenerated after Step 1 is complete. Once regenerated, annotate each pair
      of linearly adjacent accent-eligible elements:
        joint_accent = always     one member obligatorily deaccents next to the other
        joint_accent = never      both always retain independent accents when adjacent
        joint_accent = sometimes  depends on focus/givenness/speech register
      Corrective accent (e.g. "HE did it, not SHE") is out of scope — do not code
      pairs elicited or observed under a correction context (see issue #237 for the
      literature distinguishing corrective from contrastive/ordinary accent).
    span_rule_hash: "79bb5fda"
    criterion_set_status: "[NEEDS REVIEW]"  # accented is reused as-is from metrical
      # (stable there); joint_accent is new and unvalidated against real data.
    status: "[NEEDS REVIEW]"  # Derivation undecided; coding scheme itself pending real
      # annotation. Requires Adam's sign-off before any promotion (coordinator guide
      # § "Reviewing a span rule with the domain expert"). See issue #237.
    collection_required: "n"
    module_pending: "#237"  # annotation collected; span derivation not built yet


  - name: segmental
    span_rule_hash: "528bad17"
    # Formal abstract type in ch. 17 database schema.
    status: "[AUTO-DERIVED: likely stable — confirmed across 10+ language chapters; formal
      abstract type in ch. 17; coordinator sign-off needed to remove AUTO-DERIVED]"
    collection_required: "n"

  - name: tonal
    span_rule_hash: "af37c18c"
    criterion_set_status: "[AUTO-DERIVED]"
    status: "[AUTO-DERIVED]"
    collection_required: "n"

  - name: tonosegmental
    span_rule_hash: "af37c18c"
    criterion_set_status: "[AUTO-DERIVED]"
    status: "[AUTO-DERIVED]"
    collection_required: "n"

  - name: intonational
    span_rule_hash: "af37c18c"
    criterion_set_status: "[AUTO-DERIVED]"
    status: "[AUTO-DERIVED]"
    collection_required: "n"

  # suprasegmental is retired as of issue #100. Its constructions have been redistributed:
  #   metrical:      pitch-accent domain, iambic foot domain, word-stress domain,
  #                  right-edge stress domain, tone-stress locus domain,
  #                  auxiliary construction domain
  #   tonosegmental: tone melody domain, superhigh-assignment domain
  #   tonal:         H1-spreading domain, H3-assignment domain

  - name: pausing
    span_rule_hash: "1d405b34"
    criterion_set_status: stable  # Single binary criterion is appropriate; pause
      # behavior is categorical (yes/no per position).
    status: "[NEEDS REVIEW]"  # Mebengokre (ch. 12) applies and validates: diagnostic [\ref{pause}]
    # identifies span prevb-fin, converging with non-recursive interruption and stress domain.
    # No evidence in 9 other reviewed chapters; elicitation access may be the limiting factor.
    collection_required: "n"

  - name: play_language
    span_rule_hash: "b7133f53"
    criterion_set_status: stable  # Single binary criterion is appropriate; ludling
      # operation identity is encoded in the construction name.
    status: "[NEEDS REVIEW]"  # Chatino ch. 8 provides corpus-attested data (Campbell 2020);
    # target domain = positions 10-13 (verbal core = tonal melody domain). Confirmed real.
    collection_required: "n"
