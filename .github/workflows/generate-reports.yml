name: Generate reports

# Runs after data-refresh.yml completes (success or failure) so reports
# always reflect the freshest annotation data. Previously ran on a fixed
# cron at the same time as data-refresh, causing a race where reports could
# be generated from stale data. Can also be triggered manually at any time.
#
# Non-technical collaborators (e.g. John) can bookmark the Drive URL and
# always see the current state of span results and annotation completeness.
# PDFs render natively in the Drive viewer (no download needed).
#
# Required secrets (Settings → Secrets and variables → Actions):
#   PLANARS_DATA_TOKEN        — PAT with read/write access to jcgood/planars-data
#                               (the local-file door commits drive_config.json
#                               and the Drive door's provenance log there)
#   PLANARS_OAUTH_CREDENTIALS — contents of ~/.config/planars/oauth_credentials.json
#   GOOGLE_OAUTH_TOKEN        — contents of ~/.config/gspread/authorized_user.json
#
# planars-data is checked out as a clone in coded_data/, not copied in: a copy
# has no git, so what the command records would be lost (it was until
# 2026-11-04; the local-file door now refuses that).

on:
  workflow_run:
    workflows: ["Data refresh"]
    types: [completed]    # triggers after data-refresh finishes, so reports always use fresh data
  workflow_dispatch:        # allow manual trigger from the Actions tab

concurrency:
  group: generate-reports   # never two at once: both would push the same state files
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write         # the Drive door files door-violation issues in watch mode

    steps:
      - uses: actions/checkout@v5

      - name: Check out planars-data
        uses: actions/checkout@v5
        with:
          repository: jcgood/planars-data
          token: ${{ secrets.PLANARS_DATA_TOKEN }}
          path: coded_data

      - name: Configure git identity
        # The local-file door commits what the command records to planars-data.
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install WeasyPrint system dependencies
        run: sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libcairo2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write credentials
        env:
          OAUTH_CREDS: ${{ secrets.PLANARS_OAUTH_CREDENTIALS }}
          OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
        run: |
          mkdir -p ~/.config/planars ~/.config/gspread
          printf '%s' "$OAUTH_CREDS" > ~/.config/planars/oauth_credentials.json
          printf '%s' "$OAUTH_TOKEN" > ~/.config/gspread/authorized_user.json

      - name: Generate and upload reports
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m coding generate-reports --apply

      - name: Write job summary
        if: always()
        run: |
          echo "## Report generation — $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "PDF reports uploaded to Google Drive for each language in coded_data/." >> $GITHUB_STEP_SUMMARY
