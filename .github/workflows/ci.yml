name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check out planars-data
        uses: actions/checkout@v4
        with:
          repository: jcgood/planars-data
          token: ${{ secrets.PLANARS_DATA_TOKEN }}
          path: _planars_data

      - name: Merge annotation data into coded_data
        run: rsync -r --exclude='.git' _planars_data/ coded_data/

      - name: Remove legacy _filled.tsv filenames
        run: find coded_data -name "*_filled.tsv" -delete

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check codebook consistency
        run: python -m coding check-codebook

      - name: Check snapshots are up to date
        run: python check_snapshots.py

      - name: Run tests
        run: pytest

      # NonCollaborative/tests/ is not on testpaths, so the run above never
      # reaches it. Most of it needs R, and the chart checks additionally
      # compare against reference images rendered on a Mac -- Linux fonts
      # differ, so every glyph would count as a changed pixel and they would
      # fail here on charts that are fine. Those are marked needs_r and stay a
      # local gate. What is left needs nothing but Python and had never run
      # anywhere automatically.
      - name: Run the NonCollaborative tests that need no R
        run: pytest NonCollaborative/tests -m "not needs_r"
