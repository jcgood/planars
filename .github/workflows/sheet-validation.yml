name: Sheet validation

# Runs daily to detect unauthorized or accidental edits to annotation sheets.
#
# Issue handling (done by `validation-report --apply`; see
# coding/validation_report.py, and issue #260 for why):
#   - Errors and crashes get an issue; advisory warnings do not, since a known
#     recurring warning would otherwise hold an issue open indefinitely.
#   - Each report carries a fingerprint of what is wrong. Same fingerprint on a
#     later run means the same problem recurring, so it is added as a comment.
#     A different fingerprint means the open issue is about something else, so
#     it is closed as superseded and a new one is filed.
#   - The issue title names the problem, not just the date.
#   - No errors: any open issue is closed.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   PLANARS_DATA_TOKEN       — PAT with read access to jcgood/planars-data
#   PLANARS_OAUTH_CREDENTIALS — contents of ~/.config/planars/oauth_credentials.json
#   GOOGLE_OAUTH_TOKEN       — contents of ~/.config/gspread/authorized_user.json
#
# drive_config.json (only Drive IDs, no credentials) lives in planars-data at
# coded_data/drive_config.json, checked out below — no secret needed.

on:
  schedule:
    - cron: '0 9 * * *'   # daily at 09:00 UTC
  workflow_dispatch:        # allow manual trigger from the Actions tab

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Check out planars-data
        uses: actions/checkout@v4
        with:
          repository: jcgood/planars-data
          token: ${{ secrets.PLANARS_DATA_TOKEN }}
          path: _planars_data

      - name: Merge annotation data into coded_data
        run: rsync -r --exclude='.git' _planars_data/ coded_data/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write credentials
        env:
          OAUTH_CREDS: ${{ secrets.PLANARS_OAUTH_CREDENTIALS }}
          OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
        run: |
          mkdir -p ~/.config/planars ~/.config/gspread
          printf '%s' "$OAUTH_CREDS" > ~/.config/planars/oauth_credentials.json
          printf '%s' "$OAUTH_TOKEN" > ~/.config/gspread/authorized_user.json

      # --notify tells each annotator about values to fix on tabs they marked
      # ready-for-review (coding/annotator_notices.py, issue #309).
      - name: Run validate-coding
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m coding validate-coding --notify > /tmp/report.txt 2>&1
        continue-on-error: true

      - name: Write job summary
        if: always()
        run: |
          echo "## Sheet validation — $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Classifying, fingerprinting and filing/superseding/closing the issue
      # all live in a tested module — see coding/validation_report.py for why
      # (issue #260) and act_on_report for the four cases.
      - name: File, update, supersede or close the validation issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m coding validation-report /tmp/report.txt --date "$(date -u +%Y-%m-%d)" --apply
