name: Sheet validation

# Runs daily to detect unauthorized or accidental edits to annotation sheets.
#
# Issue handling (see coding/validation_report.py, and issue #260 for why):
#   - Errors and crashes get an issue; advisory warnings do not, since a known
#     recurring warning would otherwise hold an issue open indefinitely.
#   - Each report carries a fingerprint of what is wrong. Same fingerprint on a
#     later run means the same problem recurring, so it is added as a comment.
#     A different fingerprint means the open issue is about something else, so
#     it is closed as superseded and a new one is filed.
#   - The issue title names the problem, not just the date.
#   - No errors: any open issue is closed.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   PLANARS_DATA_TOKEN       — PAT with read access to jcgood/planars-data
#   PLANARS_OAUTH_CREDENTIALS — contents of ~/.config/planars/oauth_credentials.json
#   GOOGLE_OAUTH_TOKEN       — contents of ~/.config/gspread/authorized_user.json
#
# drive_config.json is committed to the repo (no credentials, only Drive IDs)
# and is used directly — no secret needed.

on:
  schedule:
    - cron: '0 9 * * *'   # daily at 09:00 UTC
  workflow_dispatch:        # allow manual trigger from the Actions tab

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Check out planars-data
        uses: actions/checkout@v4
        with:
          repository: jcgood/planars-data
          token: ${{ secrets.PLANARS_DATA_TOKEN }}
          path: _planars_data

      - name: Merge annotation data into coded_data
        run: rsync -r --exclude='.git' _planars_data/ coded_data/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write credentials
        env:
          OAUTH_CREDS: ${{ secrets.PLANARS_OAUTH_CREDENTIALS }}
          OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
        run: |
          mkdir -p ~/.config/planars ~/.config/gspread
          printf '%s' "$OAUTH_CREDS" > ~/.config/planars/oauth_credentials.json
          printf '%s' "$OAUTH_TOKEN" > ~/.config/gspread/authorized_user.json

      - name: Run validate-coding
        id: validate
        run: python -m coding validate-coding > /tmp/report.txt 2>&1
        continue-on-error: true

      - name: Write job summary
        if: always()
        run: |
          echo "## Sheet validation — $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # The open issue's body is fetched first so its fingerprint can be
      # compared against this run's: same problem recurring, or a different one?
      - name: Fetch the open validation issue, if any
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUM=$(gh issue list --label sheet-validation --state open --json number --jq '.[0].number // empty')
          echo "number=$NUM" >> $GITHUB_OUTPUT
          if [ -n "$NUM" ]; then
            gh issue view "$NUM" --json body --jq .body > /tmp/previous_body.md
          else
            : > /tmp/previous_body.md
          fi

      # Parsing, classification, and fingerprinting live in a tested module —
      # see coding/validation_report.py for why (issue #260).
      - name: Classify the validation report
        id: report
        run: |
          python -m coding validation-report /tmp/report.txt \
            --out /tmp/issue_body.md \
            --previous-body /tmp/previous_body.md \
            --date "$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      # Errors and crashes warrant an issue. Advisory warnings do not: a
      # recurring known-and-tracked warning would hold an issue open forever,
      # which is exactly what happened to #260.
      - name: File, update, or supersede the validation issue
        if: steps.report.outputs.should_file == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ steps.existing.outputs.number }}
          TITLE: ${{ steps.report.outputs.title }}
        run: |
          if [ -z "$NUM" ]; then
            gh issue create --title "$TITLE" --label sheet-validation --body-file /tmp/issue_body.md
          elif [ "${{ steps.report.outputs.same_problem }}" = "true" ]; then
            gh issue comment "$NUM" --body-file /tmp/issue_body.md
          else
            gh issue comment "$NUM" --body \
              "The problem this issue reports is no longer what validation finds. Closing as superseded; a new issue has been filed for the current one."
            gh issue close "$NUM"
            gh issue create --title "$TITLE" --label sheet-validation --body-file /tmp/issue_body.md
          fi

      - name: Close the validation issue if there are no errors
        if: steps.report.outputs.should_file == 'false' && steps.existing.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ steps.existing.outputs.number }}
        run: |
          gh issue comment "$NUM" --body \
            "Sheet validation found no errors on $(date -u +%Y-%m-%d) (${{ steps.report.outputs.warnings }} advisory warning(s), which do not block) — closing."
          gh issue close "$NUM"
