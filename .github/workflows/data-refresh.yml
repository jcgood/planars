name: Data refresh

# Runs daily: pulls fresh annotation data from Google Sheets, checks it,
# files or closes the daily GitHub issues, regenerates snapshots and commits
# to planars-data and planars. Every one of those steps is in
# coding/daily_refresh.py (`python -m coding daily-refresh` lists them); this
# file only sets up the machine and runs it (Phase 10 unit 8, issue #271).
#
# Required secrets (Settings → Secrets and variables → Actions):
#   PLANARS_DATA_TOKEN        — PAT with read/write access to jcgood/planars-data
#   PLANARS_OAUTH_CREDENTIALS — contents of ~/.config/planars/oauth_credentials.json
#   GOOGLE_OAUTH_TOKEN        — contents of ~/.config/gspread/authorized_user.json
#
# drive_config.json (only Drive IDs, no credentials) lives in planars-data at
# coded_data/drive_config.json, checked out below — no secret needed.

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC (before sheet-validation at 09:00)
  workflow_dispatch:        # allow manual trigger from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push snapshot changes to planars
      issues: write         # file and close the daily issues

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Its whole history: the chapters' check reads each chapter at the
      # planars-data version it is pinned to.
      - name: Check out planars-data
        uses: actions/checkout@v5
        with:
          repository: jcgood/planars-data
          token: ${{ secrets.PLANARS_DATA_TOKEN }}
          path: coded_data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write credentials
        env:
          OAUTH_CREDS: ${{ secrets.PLANARS_OAUTH_CREDENTIALS }}
          OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
        run: |
          mkdir -p ~/.config/planars ~/.config/gspread
          printf '%s' "$OAUTH_CREDS" > ~/.config/planars/oauth_credentials.json
          printf '%s' "$OAUTH_TOKEN" > ~/.config/gspread/authorized_user.json

      - name: Configure git identity
        # Commands commit to coded_data/ as they go (the local-file door's
        # commit at the end of each); without an identity the commit fails and the
        # next command stops on its uncommitted-changes check (#245).
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run the daily refresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # sync-overleaf's login to the chapters' Overleaf project (an
          # Overleaf git token: Account settings → Git integration).
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
        run: python -m coding daily-refresh --apply
