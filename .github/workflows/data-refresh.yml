name: Data refresh

# Runs daily to pull fresh annotation data from Google Sheets, regenerate
# snapshots, and commit any changes to planars-data and planars.
#
# This keeps snapshots continuously anchored to current annotation data so
# that snapshot failures on a PR mean exactly one thing: an uncommitted code
# change altered span output. The pre-commit hook owns code → snapshot updates;
# this job owns data → snapshot updates.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   PLANARS_DATA_TOKEN        — PAT with read/write access to jcgood/planars-data
#   PLANARS_OAUTH_CREDENTIALS — contents of ~/.config/planars/oauth_credentials.json
#   GOOGLE_OAUTH_TOKEN        — contents of ~/.config/gspread/authorized_user.json
#
# drive_config.json is committed to the repo (no credentials, only Drive IDs)
# and is used directly — no secret needed.

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC (before sheet-validation at 09:00)
  workflow_dispatch:        # allow manual trigger from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to push snapshot changes to planars
      issues: write         # needed to file sheet-drift issues

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out planars-data
        uses: actions/checkout@v4
        with:
          repository: jcgood/planars-data
          token: ${{ secrets.PLANARS_DATA_TOKEN }}
          path: coded_data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write credentials
        env:
          OAUTH_CREDS: ${{ secrets.PLANARS_OAUTH_CREDENTIALS }}
          OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
        run: |
          mkdir -p ~/.config/planars ~/.config/gspread
          printf '%s' "$OAUTH_CREDS" > ~/.config/planars/oauth_credentials.json
          printf '%s' "$OAUTH_TOKEN" > ~/.config/gspread/authorized_user.json

      - name: Configure git identity for coded_data
        # import-planar and restructure-sheets call drive._autocommit_data(),
        # which commits+pushes directly to coded_data/ as soon as they write a
        # changed file — before the later "Commit and push planars-data changes"
        # step ever runs. Without an identity configured this early, that inline
        # commit fails silently (a WARNING line, not a raised error), leaving
        # coded_data/ dirty for the "Import annotation data" step right after,
        # which then aborts on its uncommitted-changes guard (#245).
        working-directory: coded_data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Record planars-data state before import
        # Gap 2 (#121): snapshot the planars-data HEAD and the set of files
        # touched by human (non-bot) commits since the last data-refresh run.
        # Used after the import to detect whether fresh Sheet data overwrote
        # work a coordinator committed directly to planars-data.
        #
        # Excluded from the at-risk list (workflow legitimately updates these):
        #   notes_state.json            — always rewritten by check-notes --apply
        #   lang_setup/diagnostics_*  — derived artifacts regenerated from YAML
        #     by sync-diagnostics-yaml; coordinator intent lives in the YAML, not
        #     the TSV, so a refresh updating the TSV is correct, not an overwrite.
        #   lang_setup/planar_*       — planar TSVs are imported from the planar
        #     Google Sheet by import-planar; the Sheet is the source of truth, so
        #     a refresh updating the TSV is correct, not an overwrite.
        id: pre_import
        working-directory: coded_data
        run: |
          echo "before_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          LAST_BOT=$(git log --format="%H %ae" | grep "github-actions\[bot\]" | head -1 | cut -d' ' -f1 || true)
          if [ -n "$LAST_BOT" ]; then
            git diff --name-only "$LAST_BOT" HEAD \
              | grep -v "^notes_state\.json$" \
              | grep -v "lang_setup/diagnostics_" \
              | grep -v "lang_setup/planar_" \
              > /tmp/human_committed_files.txt || true
          else
            git ls-files \
              | grep -v "^notes_state\.json$" \
              | grep -v "lang_setup/diagnostics_" \
              | grep -v "lang_setup/planar_" \
              > /tmp/human_committed_files.txt || true
          fi
          echo "Human-committed files at risk of overwrite:"
          cat /tmp/human_committed_files.txt || echo "(none)"

      - name: Import planar from Google Sheets
        id: import_planar
        run: python -m coding import-planar --apply > /tmp/planar_report.txt 2>&1
        continue-on-error: true

      - name: Build and file planar-changed issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, os
          from pathlib import Path

          changes_file = Path("/tmp/planar_changes.json")
          if not changes_file.exists():
              exit(0)
          changes = json.loads(changes_file.read_text())
          if not changes:
              exit(0)

          lines = [
              "## Planar structure changed\n\n",
              "One or more language planars were updated from Google Sheets. "
              "Annotation sheets need to be updated to match.\n",
          ]
          for lang_id, info in changes.items():
              lines.append(f"\n### {lang_id}\n\n")
              diff = info["diff"]
              for n, name in diff.get("added", {}).items():
                  lines.append(f"- `+` position {n} (`{name}`) — added\n")
              for n, name in diff.get("deleted", {}).items():
                  lines.append(f"- `-` position {n} (`{name}`) — removed\n")
              for n, pair in diff.get("renamed", {}).items():
                  lines.append(f"- `~` position {n}: `{pair[0]}` → `{pair[1]}`\n")
              for col in diff.get("columns_added", []):
                  lines.append(f"- `+` column `{col}` — added\n")
              if not any([diff.get("added"), diff.get("deleted"),
                          diff.get("renamed"), diff.get("columns_added")]):
                  lines.append("- (content-only changes — elements, examples, or notes)\n")
              lines.append(f"\n**Command to run:**\n```\n{info['recommendation']}\n```\n")
          lines.append(
              "\nClose this issue after running the recommended command "
              "and verifying annotation sheets are up to date.\n"
          )
          Path("/tmp/planar_changed_body.md").write_text("".join(lines))
          PYEOF

          if [ -f /tmp/planar_changed_body.md ]; then
            bash .github/scripts/manage_issue.sh file planar-changed \
              "Planar structure changed — annotation sheets need updating ($(date -u +%Y-%m-%d))" \
              /tmp/planar_changed_body.md
          elif [ "${{ steps.import_planar.outcome }}" = "success" ]; then
            bash .github/scripts/manage_issue.sh close planar-changed \
              "No planar changes detected on $(date -u +%Y-%m-%d) — closing."
          fi

      - name: Import annotation data from Google Sheets
        id: import_sheets
        run: python -m coding import-sheets --apply --ignore-status > /tmp/import_report.txt 2>&1
        continue-on-error: true

      - name: Write import summary
        if: always()
        run: |
          echo "## Import — $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/import_report.txt ]; then
            cat /tmp/import_report.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "(import did not produce output — step may have crashed before writing)" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: File or update GitHub issue if import failed
        if: steps.import_sheets.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import os
          text = open('/tmp/import_report.txt').read() if os.path.exists('/tmp/import_report.txt') else ""
          lines = text.splitlines()
          errors = [l.strip() for l in lines if l.startswith('ERROR:')]
          # Issue #283: import-sheets now also exits non-zero on a blocking
          # WARNING (a class's spreadsheet couldn't be opened, a tab is
          # missing, or a ready-for-review tab has an invalid-value/
          # structural problem) -- those never have an ERROR: line, so
          # without this the summary below would fall through to an
          # arbitrary 25-line tail that may not even contain the warning.
          warnings = [l.strip() for l in lines if 'WARNING:' in l]
          with open('/tmp/import_error_body.md', 'w') as f:
              f.write("## What's wrong\n\n")
              if errors:
                  f.write('\n'.join(f"- {e}" for e in errors) + '\n')
              elif warnings:
                  f.write('\n'.join(f"- {w}" for w in warnings) + '\n')
              else:
                  # No ERROR: or WARNING: lines — likely an API exception or
                  # traceback. Show the last 25 lines so the actual error is visible.
                  tail = lines[-25:] if len(lines) > 25 else lines
                  f.write("_(No `ERROR:` lines found — showing end of output where the failure likely appears.)_\n\n")
                  f.write("```\n")
                  f.write('\n'.join(tail))
                  f.write("\n```\n")
              f.write("\n## What to do\n\n")
              f.write("Common causes:\n")
              f.write('- **OAuth token expired** — re-authorize credentials (see `docs/coordinator-guide.md § "OAuth setup"`)\n')
              f.write("- **Sheet structure changed** — run `python -m coding update-sheets --apply`\n")
              f.write("- **Uncommitted `coded_data/` changes** — commit or discard them locally, then re-trigger this workflow\n")
              f.write("- **API quota exhausted** — transient; the issue will close automatically when the next run succeeds\n")
              f.write("\nThe issue closes automatically when the next import run succeeds.\n")
              f.write("\n## Full log\n\n")
              f.write("<details><summary>Show full import output</summary>\n\n```\n")
              f.write(text)
              f.write("\n```\n\n</details>\n")
          PYEOF
          bash .github/scripts/manage_issue.sh file import-error "Import error in data refresh ($(date -u +%Y-%m-%d))" /tmp/import_error_body.md

      - name: Close open import-error issue if import succeeded
        if: steps.import_sheets.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/manage_issue.sh close import-error "Import succeeded on $(date -u +%Y-%m-%d) — closing."

      - name: Remind if pending-changes issue is stale
        # If an open pending-changes issue has been open for more than 7 days,
        # add a daily comment to resurface it. Uses the GitHub issue creation
        # date — not pending_changes.json, which is gitignored and never present
        # in CI. The issue is the persistent record; the file is ephemeral.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STALE=$(gh issue list --label pending-changes --state open \
            --json number,createdAt \
            --jq '[.[] | select((now - (.createdAt | fromdateiso8601)) > 604800)] | .[].number')
          for ISSUE_NUM in $STALE; do
            gh issue comment "$ISSUE_NUM" \
              --body "Reminder: this pending-changes issue has been open for more than 7 days as of $(date -u +%Y-%m-%d). Run \`python -m coding apply-pending\` to review and apply each change."
          done

      - name: Check collaborator notes docs
        # Reads each language's Google Doc for new collaborator notes. If new
        # content is detected, files or updates a per-annotator collaborator-notes
        # GitHub issue containing the notes and a ready-to-paste Claude triage prompt.
        # Also appends an acknowledgment line to the doc so collaborators know their
        # notes were received. Updates coded_data/notes_state.json with content hashes.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m coding check-notes --apply
        continue-on-error: true

      - name: Commit and push planars-data changes from import
        # Everything above this point (import-planar, import-sheets,
        # check-notes) writes to coded_data/ but does not commit -- unlike
        # restructure-sheets/import-planar's own inline _autocommit_data()
        # calls, import-sheets relies entirely on a workflow-level commit.
        # Before this step existed, that commit only happened once, near the
        # end of the job (see "Commit and push planars-data changes"
        # below) -- so every coded_data_clean_tree-gated command between
        # here and there (sync-diagnostics-yaml, sync-params,
        # generate-sheets --regen-dependents) ran against an
        # already-dirtied tree and silently aborted on its own
        # uncommitted-changes guard, every time import-sheets or
        # check-notes actually changed a file. Invisible until issue #283
        # added real issue-filing to two of those steps, which is what
        # surfaced it (#289, #290) rather than introduced it -- this was
        # already happening, just never visible. Same fix shape as #245's
        # "Configure git identity for coded_data" step above: commit
        # promptly rather than let same-run intermediate state look dirty
        # to a precondition meant to catch a genuinely stale prior run.
        working-directory: coded_data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No annotation data changes from import."
          else
            git commit -m "data: daily import refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Regenerate diagnostics TSVs from YAML
        # Keeps diagnostics_{lang_id}.tsv in sync with the YAML source of truth.
        # Catches cases where a coordinator edited the YAML locally but forgot to
        # run sync-diagnostics-yaml --apply before committing.
        id: sync_diag_tsv
        run: python -m coding sync-diagnostics-yaml --apply > /tmp/sync_diag_tsv_report.txt 2>&1
        continue-on-error: true

      - name: Commit and push planars-data changes from diagnostics sync
        # Second instance of the same class of gap the step above this
        # block exists for (issue #283, 2026-08-20) -- found live, the same
        # day, by triggering this workflow manually to confirm the first
        # fix: gap 1's own change (making sync-diagnostics-yaml able to
        # actually write diagnostics_{lang}.tsv instead of silently
        # skipping arao1248 over its non-blocking proform gap) means this
        # step can now genuinely dirty coded_data/ -- and nothing committed
        # that write before the very next coded_data_clean_tree-gated step
        # (--to-sheet, right below) ran, so it aborted on its own sibling's
        # uncommitted output (#289, #290 both cited the same file:
        # arao1248/lang_setup/diagnostics_arao1248.tsv). sync-params, later
        # in this job, was checked and confirmed not to write to coded_data/
        # on its automated bare --apply invocation (no --rename/--split/
        # --merge), so it does not need the same treatment.
        working-directory: coded_data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No annotation data changes from diagnostics sync."
          else
            git commit -m "data: daily diagnostics sync refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Push diagnostics YAML changes back to Google Sheets
        # Keeps the diagnostics Google Sheet in sync with the YAML source of truth.
        # Prevents false-alarm diagnostics-drift issues caused by stale Sheet content
        # (e.g. old class names after a rename). See issue #125.
        id: sync_diag_sheet
        run: python -m coding sync-diagnostics-yaml --to-sheet --apply > /tmp/sync_diag_sheet_report.txt 2>&1
        continue-on-error: true

      - name: Write diagnostics YAML sync summary
        # Advisory (non-blocking) WARNING lines from either direction don't
        # fail the step above, so they'd otherwise never appear anywhere --
        # same reasoning as the "Write import summary" step above, and the
        # same gap issue #283's sweep found here for the blocking-error case.
        if: always()
        run: |
          echo "## Diagnostics YAML sync — $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/sync_diag_tsv_report.txt ]; then
            cat /tmp/sync_diag_tsv_report.txt >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f /tmp/sync_diag_sheet_report.txt ]; then
            cat /tmp/sync_diag_sheet_report.txt >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: File or update GitHub issue if diagnostics YAML has blocking errors
        # Issue #283: both steps above used to always exit 0, even when a
        # language's diagnostics_{lang_id}.yaml had a blocking validation
        # error (e.g. a mismatched `language:` field) -- the error only ever
        # reached this step's own log, which CI discards. Both commands now
        # exit non-zero on a blocking error (a non-blocking one, like a
        # required class not yet drafted, correctly does not -- see
        # ValidationIssue.blocking's docstring), so the step outcome alone is
        # enough to file/close an issue, no stdout marker parsing needed
        # (unlike diagnostics-drift/dependent-stale below, which predate this
        # exit-code signal).
        if: steps.sync_diag_tsv.outcome == 'failure' || steps.sync_diag_sheet.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY_FILE=$(mktemp)
          echo "## Diagnostics YAML validation errors — $(date -u +%Y-%m-%d)" >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "One or more languages' \`diagnostics_{lang_id}.yaml\` failed validation" >> "$BODY_FILE"
          echo "during the daily data refresh, so their TSV and/or diagnostics Google Sheet" >> "$BODY_FILE"
          echo "were not updated." >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "## What to do" >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "Fix the errors named below in the language's \`diagnostics_{lang_id}.yaml\`," >> "$BODY_FILE"
          echo "then run \`python -m coding sync-diagnostics-yaml --apply\` (and" >> "$BODY_FILE"
          echo "\`--to-sheet --apply\` if the Sheet also needs updating)." >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "The issue closes automatically once both directions run clean." >> "$BODY_FILE"
          if [ -f /tmp/sync_diag_tsv_report.txt ]; then
            echo "" >> "$BODY_FILE"
            echo "## YAML → TSV direction" >> "$BODY_FILE"
            echo "" >> "$BODY_FILE"
            echo '<details><summary>Show full output</summary>' >> "$BODY_FILE"
            echo "" >> "$BODY_FILE"
            echo '```' >> "$BODY_FILE"
            cat /tmp/sync_diag_tsv_report.txt >> "$BODY_FILE"
            echo '```' >> "$BODY_FILE"
            echo "" >> "$BODY_FILE"
            echo '</details>' >> "$BODY_FILE"
          fi
          if [ -f /tmp/sync_diag_sheet_report.txt ]; then
            echo "" >> "$BODY_FILE"
            echo "## YAML → Sheet direction" >> "$BODY_FILE"
            echo "" >> "$BODY_FILE"
            echo '<details><summary>Show full output</summary>' >> "$BODY_FILE"
            echo "" >> "$BODY_FILE"
            echo '```' >> "$BODY_FILE"
            cat /tmp/sync_diag_sheet_report.txt >> "$BODY_FILE"
            echo '```' >> "$BODY_FILE"
            echo "" >> "$BODY_FILE"
            echo '</details>' >> "$BODY_FILE"
          fi
          bash .github/scripts/manage_issue.sh file diagnostics-yaml-error "Diagnostics YAML validation errors ($(date -u +%Y-%m-%d))" "$BODY_FILE"
          rm -f "$BODY_FILE"

      - name: Close open diagnostics-yaml-error issue if all clear
        if: steps.sync_diag_tsv.outcome == 'success' && steps.sync_diag_sheet.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/manage_issue.sh close diagnostics-yaml-error "Diagnostics YAML validation passed on $(date -u +%Y-%m-%d) — closing."

      - name: Sync criterion columns to annotation sheets
        # Issue #120: adds missing criterion columns and updates dropdown validation
        # for any new criteria added to diagnostics_{lang}.yaml since the last run.
        # Safe to automate: --apply without destructive flags (--rename/--remove/
        # --split/--merge) is additive-only and idempotent.
        run: python -m coding sync-params --apply
        continue-on-error: true

      - name: Regenerate dependent constructions (simple case)
        # After element_prescreening is imported, automatically regenerate the general
        # (pair-row) tab with a filtered pair list. Only fires when the dependent
        # TSV has no annotation data yet — safe to automate with no data loss.
        # If the dependent TSV already has annotations, skips and lets the
        # dependent-stale check below file an issue for coordinator action.
        id: regen_dependents
        run: python -m coding generate-sheets --regen-dependents > /tmp/regen_dependents_report.txt 2>&1
        continue-on-error: true

      - name: File or update GitHub issue if a dependent construction failed to regenerate
        # Issue #283: a per-language regeneration failure was caught and
        # printed inside _regen_dependents_simple but otherwise vanished --
        # this step had zero output capture and zero follow-up of any kind,
        # so a real failure here was invisible to everything downstream.
        # generate-sheets now exits non-zero when any regeneration failed,
        # so the step outcome is enough to file/close an issue directly.
        if: steps.regen_dependents.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY_FILE=$(mktemp)
          echo "## Dependent construction regeneration failed — $(date -u +%Y-%m-%d)" >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "\`generate-sheets --regen-dependents\` failed to regenerate one or more" >> "$BODY_FILE"
          echo "dependent (pair-row) tabs during the daily data refresh — see the failure" >> "$BODY_FILE"
          echo "lines in the full log below." >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "## What to do" >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "Investigate the error below, then re-run for the affected language:" >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo '```bash' >> "$BODY_FILE"
          echo "python -m coding generate-sheets --lang LANG_ID --regen-construction CLASS:CONSTRUCTION" >> "$BODY_FILE"
          echo '```' >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "The issue closes automatically once a run regenerates everything cleanly." >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "## Full log" >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo '<details><summary>Show full output</summary>' >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo '```' >> "$BODY_FILE"
          if [ -f /tmp/regen_dependents_report.txt ]; then
            cat /tmp/regen_dependents_report.txt >> "$BODY_FILE"
          fi
          echo '```' >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo '</details>' >> "$BODY_FILE"
          bash .github/scripts/manage_issue.sh file regen-dependents-error "Dependent construction regeneration failed ($(date -u +%Y-%m-%d))" "$BODY_FILE"
          rm -f "$BODY_FILE"

      - name: Close open regen-dependents-error issue if all clear
        if: steps.regen_dependents.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/manage_issue.sh close regen-dependents-error "Dependent construction regeneration succeeded on $(date -u +%Y-%m-%d) — closing."

      - name: Check for stale dependent constructions
        id: check_dependents
        run: python -m coding integrity-check --check-dependents > /tmp/dependents_report.txt 2>&1
        continue-on-error: true

      - name: File or update GitHub issue if dependent construction stale
        if: steps.check_dependents.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          text = open('/tmp/dependents_report.txt').read()
          errors = [l.strip()[1:].strip() for l in text.splitlines() if l.strip().startswith('✗')]
          with open('/tmp/dependents_stale_body.md', 'w') as f:
              f.write("## What's wrong\n\n")
              if errors:
                  f.write('\n'.join(f"- {e}" for e in errors) + '\n')
              else:
                  f.write("_(Details could not be extracted — see full log.)_\n")
              f.write("\n## What to do\n\n")
              f.write("The `element_prescreening` annotation has changed since the `general` "
                      "(pair-row) tab was last generated. The pair list needs to be regenerated "
                      "to reflect the current element_prescreening decisions.\n\n")
              f.write("**This requires coordinator action** because the general tab may already "
                      "have annotation data that needs to be reviewed.\n\n")
              f.write("Run the following command for each affected language "
                      "(shown in the errors above):\n\n")
              f.write("```bash\n")
              f.write("python -m coding generate-sheets --lang LANG_ID "
                      "--regen-construction nonpermutability:general\n")
              f.write("```\n\n")
              f.write("Then run `python -m coding import-sheets --apply` to import the "
                      "updated sheet. Any removed pairs will appear in `apply-pending` "
                      "for review before the TSV is updated.\n\n")
              f.write("The issue closes automatically when the element sets are back in sync.\n")
              f.write("\n## Full log\n\n")
              f.write("<details><summary>Show full check output</summary>\n\n```\n")
              f.write(text)
              f.write("\n```\n\n</details>\n")
          PYEOF
          bash .github/scripts/manage_issue.sh file dependent-stale "Dependent construction stale — regeneration needed ($(date -u +%Y-%m-%d))" /tmp/dependents_stale_body.md

      - name: Close open dependent-stale issue if all clear
        if: steps.check_dependents.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/manage_issue.sh close dependent-stale "Dependent constructions in sync on $(date -u +%Y-%m-%d) — closing."

      - name: Check for diagnostics YAML drift
        id: diag_drift
        run: |
          if [ -f diagnostics_drift.json ]; then
            COUNT=$(python -c "import json; d=json.load(open('diagnostics_drift.json')); print(len(d))")
            if [ "$COUNT" -gt 0 ]; then
              echo "drift=true" >> $GITHUB_OUTPUT
            else
              echo "drift=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "drift=false" >> $GITHUB_OUTPUT
          fi

      - name: File or update GitHub issue if diagnostics drift detected
        if: steps.diag_drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY_FILE=$(mktemp)
          echo "## Diagnostics YAML drift detected — $(date -u +%Y-%m-%d)" >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "The daily data refresh found ambiguous differences between a diagnostics TSV" >> "$BODY_FILE"
          echo "(downloaded from Google Sheets) and the corresponding YAML source of truth." >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "**Ambiguous changes require coordinator review** before they can be applied." >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "To resolve:" >> "$BODY_FILE"
          echo "1. Pull latest \`coded_data/\` and run \`python -m coding sync-diagnostics-yaml --from-tsv\` (dry run)" >> "$BODY_FILE"
          echo "2. Review the output and edit the YAML directly for any ambiguous items" >> "$BODY_FILE"
          echo "3. Run \`python -m coding sync-diagnostics-yaml --apply\` to regenerate the TSV from the corrected YAML" >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "### Drift details" >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "| Language | Class | Change type | Suggestions |" >> "$BODY_FILE"
          echo "|---|---|---|---|" >> "$BODY_FILE"
          jq -r '.[] | .lang_id as $lang | .ambiguous[] |
            "| \($lang) | \(.class_name) | \(.kind) | \(if (.suggestions // []) | length > 0 then (.suggestions | join(", ")) else "—" end) |"' \
            diagnostics_drift.json >> "$BODY_FILE"
          bash .github/scripts/manage_issue.sh file diagnostics-drift "Diagnostics YAML drift detected ($(date -u +%Y-%m-%d))" "$BODY_FILE"
          rm -f "$BODY_FILE"

      - name: Close open diagnostics drift issue if all clear
        if: steps.diag_drift.outputs.drift == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/manage_issue.sh close diagnostics-drift "Diagnostics YAML drift resolved on $(date -u +%Y-%m-%d) — closing."

      - name: Check codebook consistency
        # Gap 1 (#121): catches schema inconsistencies (criteria in modules but
        # not in diagnostic_criteria.yaml, required criteria missing from
        # diagnostics_{lang}.tsv, etc.) that can arise from data changes as well
        # as code changes. CI covers the code-change path; this covers the
        # data-change path (e.g. new class added to diagnostics TSV via sheets).
        id: codebook
        run: python -m coding check-codebook > /tmp/codebook_report.txt 2>&1
        continue-on-error: true

      - name: Generate rule-update prompts for stale hashes
        if: steps.codebook.outcome == 'failure'
        run: python -m coding generate-rule-update-prompt > /tmp/rule_update_prompts.txt 2>&1
        continue-on-error: true

      - name: File or update GitHub issue if codebook check failed
        if: steps.codebook.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import os
          report = open('/tmp/codebook_report.txt').read()
          errors = [l.strip()[1:].strip() for l in report.splitlines() if l.strip().startswith('\u2717')]
          prompts_path = '/tmp/rule_update_prompts.txt'
          has_prompts = os.path.exists(prompts_path) and os.path.getsize(prompts_path) > 0
          with open('/tmp/codebook_error_body.md', 'w') as f:
              f.write("## What's wrong\n\n")
              if errors:
                  f.write('\n'.join(f"- {e}" for e in errors) + '\n')
              else:
                  f.write("_(Inconsistency details could not be extracted — see full log.)_\n")
              f.write("\n## What to do\n\n")
              f.write("What to do depends on the specific error:\n")
              f.write("- **Qualification rule hash mismatch** — paste the Claude prompt below into a new conversation, review the proposed changes, then run `python -m coding sync-qualification-hashes --apply`\n")
              f.write("- **Criterion missing from `diagnostic_criteria.yaml`** — add an entry to `schemas/diagnostic_criteria.yaml`\n")
              f.write("- **TSV class/criteria mismatch** — update `diagnostics_{lang_id}.yaml` and run `python -m coding sync-diagnostics-yaml --apply`\n")
              f.write("\nThe issue closes automatically when `check-codebook` passes.\n")
              f.write("\n## Full log\n\n")
              f.write("<details><summary>Show full codebook check output</summary>\n\n```\n")
              f.write(report)
              f.write("\n```\n\n</details>\n")
              if has_prompts:
                  f.write("\n---\n\n## Ready-to-paste Claude prompts\n\n")
                  f.write(open(prompts_path).read())
          PYEOF
          bash .github/scripts/manage_issue.sh file codebook-error "Codebook inconsistency detected ($(date -u +%Y-%m-%d))" /tmp/codebook_error_body.md

      - name: Close open codebook-error issue if all clear
        if: steps.codebook.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/manage_issue.sh close codebook-error "Codebook check passed on $(date -u +%Y-%m-%d) — closing."

      - name: Check for stale manifest entries
        # Flags manifest classes that are no longer in diagnostics_{lang}.yaml.
        # Fast: reads local YAML files only, no Sheet API calls.
        # Tells the coordinator to run prune-manifest before data-refresh keeps
        # re-importing retired sheets indefinitely.
        id: stale_manifest
        run: python -m coding integrity-check --check-manifest > /tmp/stale_manifest.txt 2>&1
        continue-on-error: true

      - name: File or update GitHub issue if stale manifest entries found
        if: steps.stale_manifest.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/manage_issue.sh file stale-manifest "Stale manifest entries detected ($(date -u +%Y-%m-%d))" /tmp/stale_manifest.txt

      - name: Close open stale-manifest issue if all clear
        if: steps.stale_manifest.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/manage_issue.sh close stale-manifest "Stale manifest entries resolved on $(date -u +%Y-%m-%d) — closing."

      - name: Run integrity check
        # Validates planar TSV structure and analysis module consistency —
        # things that can break due to data changes, not just code changes.
        # Complements check-codebook (which focuses on schema consistency).
        id: integrity
        run: python -m coding integrity-check > /tmp/integrity_report.txt 2>&1
        continue-on-error: true

      - name: File or update GitHub issue if integrity check failed
        if: steps.integrity.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          text = open('/tmp/integrity_report.txt').read()
          errors = [l.strip()[1:].strip() for l in text.splitlines() if l.strip().startswith('\u2717')]
          with open('/tmp/integrity_error_body.md', 'w') as f:
              f.write("## What's wrong\n\n")
              if errors:
                  f.write('\n'.join(f"- {e}" for e in errors) + '\n')
              else:
                  f.write("_(Error details could not be extracted — see full log.)_\n")
              f.write("\n## What to do\n\n")
              f.write(
                  "Each bullet above corresponds to a `\u2717` line in the full log. "
                  "The `\u2192` lines below each one in the full log explain what to do. "
                  "Run `python -m coding integrity-check` locally for the full report with guidance.\n\n"
                  "The issue closes automatically when the integrity check passes.\n"
              )
              f.write("\n## Full log\n\n")
              f.write("<details><summary>Show full integrity check output</summary>\n\n```\n")
              f.write(text)
              f.write("\n```\n\n</details>\n")
          PYEOF
          bash .github/scripts/manage_issue.sh file integrity-error "Integrity check failed ($(date -u +%Y-%m-%d))" /tmp/integrity_error_body.md

      - name: Close open integrity-error issue if all clear
        if: steps.integrity.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/manage_issue.sh close integrity-error "Integrity check passed on $(date -u +%Y-%m-%d) — closing."

      - name: Regenerate snapshots
        # Gap 4 (#121): if: always() ensures snapshots are regenerated even when
        # earlier steps failed (e.g. import-sheets crash). coded_data/ is always
        # populated by the checkout step so generation is safe to run regardless.
        if: always()
        run: python generate_snapshots.py

      - name: Commit and push planars-data changes
        working-directory: coded_data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No annotation data changes."
          else
            git commit -m "data: daily annotation refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Check for coordinator data overwritten by refresh
        # Gap 2 (#121): intersect human-committed files (recorded pre-import)
        # with files changed by today's import. An intersection means the
        # coordinator's direct planars-data commits may have been overwritten.
        id: overwrite_check
        if: always()
        working-directory: coded_data
        run: |
          touch /tmp/human_committed_files.txt
          BEFORE="${{ steps.pre_import.outputs.before_sha }}"
          AFTER=$(git rev-parse HEAD)
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$AFTER" ]; then
            echo "No planars-data changes — skipping overwrite check."
            echo "overwrite=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git diff --name-only "$BEFORE" "$AFTER" > /tmp/refresh_changed_files.txt
          comm -12 <(sort /tmp/human_committed_files.txt) <(sort /tmp/refresh_changed_files.txt) > /tmp/overwritten_files.txt
          if [ -s /tmp/overwritten_files.txt ]; then
            echo "overwrite=true" >> $GITHUB_OUTPUT
            echo "Potentially overwritten files:"
            cat /tmp/overwritten_files.txt
          else
            echo "overwrite=false" >> $GITHUB_OUTPUT
            echo "No coordinator files overwritten."
          fi

      - name: File or update GitHub issue if coordinator data overwritten
        if: steps.overwrite_check.outputs.overwrite == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY_FILE=$(mktemp)
          echo "## Coordinator data may have been overwritten — $(date -u +%Y-%m-%d)" >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "The daily data refresh detected human commits to planars-data that were" >> "$BODY_FILE"
          echo "overwritten by today's import from Google Sheets." >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "This may be a false alarm if the coordinator's local edit matched the Sheet." >> "$BODY_FILE"
          echo "But if the Sheet was stale (e.g. after a column rename), annotation data may be lost." >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "**Check git history in planars-data to verify. Use \`git log\` and \`git show\`** on the commit(s) listed below, then compare against the current TSV." >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "### Files affected" >> "$BODY_FILE"
          echo '```' >> "$BODY_FILE"
          cat /tmp/overwritten_files.txt >> "$BODY_FILE"
          echo '```' >> "$BODY_FILE"
          bash .github/scripts/manage_issue.sh file data-overwrite "Coordinator data may have been overwritten by data-refresh ($(date -u +%Y-%m-%d))" "$BODY_FILE"
          rm -f "$BODY_FILE"

      - name: Close open data-overwrite issue if all clear
        if: steps.overwrite_check.outputs.overwrite == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/manage_issue.sh close data-overwrite "No coordinator data overwritten on $(date -u +%Y-%m-%d) — closing."

      - name: Commit and push planars snapshot changes
        # Gap 4 (#121): if: always() ensures snapshots are committed even when
        # earlier steps failed, preventing stale-snapshot CI failures on the
        # next code push.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/snapshots/
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "snapshots: regenerate from daily data refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Apply additive sheet updates
        # Gap 3 (#121): auto-apply new planar elements and missing trailing
        # columns to existing annotation sheets. This is additive and safe —
        # same reasoning as sync-params --apply (#120). Exit 1 means structural
        # drift that only restructure-sheets can fix; additive changes are always
        # applied in-place. No separate dry-run needed — this output IS the drift
        # report, and the second read pass was causing quota exhaustion (#154).
        id: update_sheets
        run: python -m coding update-sheets --apply > /tmp/update_sheets_report.txt 2>&1
        continue-on-error: true

      - name: Write drift summary
        if: always()
        run: |
          echo "## Sheet drift check — $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/update_sheets_report.txt ]; then
            cat /tmp/update_sheets_report.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "(update-sheets did not run)" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: File or update GitHub issue if drift detected
        if: steps.update_sheets.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/manage_issue.sh file sheet-drift "Sheet drift detected — update-sheets --apply needs review ($(date -u +%Y-%m-%d))" /tmp/update_sheets_report.txt

      - name: Close open drift issue if all clear
        if: steps.update_sheets.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/manage_issue.sh close sheet-drift "Sheet drift resolved on $(date -u +%Y-%m-%d) — closing."

      - name: Annotation scope summary
        # Informational: count languages, classes, and constructions from
        # diagnostics YAMLs so the step summary gives a quick project-wide picture.
        if: always()
        run: |
          LANGS=$(find coded_data -maxdepth 1 -mindepth 1 -type d -not -name ".*" | wc -l | tr -d ' ')
          YAMLS=$(find coded_data -name "diagnostics_*.yaml" | wc -l | tr -d ' ')
          TSVS=$(find coded_data -name "*.tsv" -not -path "*/archive/*" -not -path "*/lang_setup/*" | wc -l | tr -d ' ')
          echo "## Annotation scope — $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${LANGS} language(s) · ${YAMLS} with diagnostics YAML · ${TSVS} filled construction TSV(s)" >> $GITHUB_STEP_SUMMARY
