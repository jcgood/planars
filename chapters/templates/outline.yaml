# The sections of each kind of chapter, in order: the one statement of a
# chapter's outline. build-chapters writes chapter.tex from it (through
# chapter.tex.j2) and makes a prose stub for each slot named here, with the
# slot's instructions written into it for whoever writes there.
#
# A section has any of:
#   heading:    its \section title (none: text before the first section)
#   slot:       the name of its prose file, prose/<slot>.tex
#   who:        who writes the slot (shown in the stub)
#   says:       what the slot should say (shown in the stub)
#   fragments:  generated fragments, \input after the prose, in order
#   figures:    (results only) charts drawn from each language's analysis,
#               placed after the fragments: [{chart, dataset}] (see results)
#   classes:    true: one \section per domain type, holding one \subsection
#               per class the chapter covers, in the schema's class order;
#               each has the slot class_<class> and, for each name in
#               class_fragments, the fragment <name>_<class>, in order.
#               `who` and `says` apply to every class slot.
#
# Renaming a slot leaves its old prose file behind: the build lists it as
# no longer in the outline, never deletes it, so move its text by hand.

language:
  - fragments: [front_matter]
  - heading: Introduction
    slot: background
    who: the language's annotator
    says: >-
      The language and its speakers, the sources the annotation draws on,
      and anything about its grammar a reader needs before the planar
      structure.
  - heading: The planar structure
    slot: planar
    who: the language's annotator
    says: >-
      How the positions were chosen, what the keystone is, and any position
      whose content is not obvious from its name.
    fragments: [planar_table]
  - heading: The diagnostics
    slot: diagnostics
    who: the language's annotator
    says: >-
      Which diagnostics apply to this language and why; any the language
      does not have, and why not.
    fragments: [diagnostics_table]
  - classes: true
    class_fragments: [class, examples]
    who: the language's annotator
    says: >-
      Each construction used as a test: what it is, with an example, why it
      was chosen, and anything that made coding it hard. The spans it gives,
      and the examples given in the annotation, follow this text and are
      written by the build.
  - heading: The spans together
    slot: spans
    who: the language's annotator
    says: >-
      What the spans show taken together: where they converge, where they
      do not, and what that says about constituency in this language.
    fragments: [spans_table]

# The results chapter: the analysis of every language in the volume, each
# read at its own chapter's pin. The tables are generated; which test bears
# on which hypothesis, and what the numbers show, is prose.
results:
  - heading: The analysis
    slot: analysis
    who: Jeff Good and Adam Tallman
    says: >-
      What was analysed: the datasets (spans grouped by domain type or by
      class; every span, those from complete or partial positions, or
      distinct spans), what a laminar family and a conflict are, and how to
      read the table and the charts that follow, written by the build.
    fragments: [analysis_summary]
    # Charts drawn from each language's weekly analysis at its chapter's
    # pin, after the fragments, in this order. `chart` is the renderer's
    # name (render_planarsviz.R's chart_table(); planarsviz/docs/charts.md),
    # `dataset` the grouping and selection (types or classes; all, complete,
    # partial or distinct). Add or remove a line here and rebuild.
    figures:
      - {chart: all_families_labeled_legend, dataset: types_all}   # the combined forest
      - {chart: pooled_domainplot, dataset: types_all}             # spans as bars coloured by domain type
  - heading: The permutation tests
    slot: tests
    who: Jeff Good and Adam Tallman
    says: >-
      What each of the three tests asks (the fragmentation test shuffles
      domain-type labels; the span-placement test keeps each span's length
      and moves it; the arbitrary-layers test draws spans of any size), and
      why three. Their tables follow, written by the build.
    fragments: [test_fragmentation, test_span_placement, test_arbitrary_layers]
  - heading: The tree hypothesis
    slot: tree
    who: Jeff Good and Adam Tallman
    says: >-
      Whether the domains nest, and which numbers above show it, cited by
      name (\pv) rather than typed.
  - heading: The morphosyntax/phonology divide
    slot: divide
    who: Jeff Good and Adam Tallman
    says: >-
      Whether deviations from nesting fall between morphosyntactic and
      phonological diagnostics rather than within either, from the
      per-group results above.
  - heading: The word hypothesis
    slot: word
    who: Jeff Good and Adam Tallman
    says: >-
      Whether some diagnostics converge on a span that partitions the
      larger domain. Needs each language's word chosen (English: #335);
      until then, say what is still open.

# The progress report's parts of its own (docs/zenodo-report-plan.md, "What
# the report contains"): a summary, who did what, the status and limits, and
# the next steps. The summary and the next steps are prose only.
summary:
  - slot: summary
    who: Jeff Good and Adam Tallman
    says: >-
      What the project did in the period this report covers, in a few
      paragraphs: the languages annotated, the framework and tooling built,
      and what the analysis shows so far. Cite numbers by name (\pv), from
      the English chapter, the results and who did what.

# Who did what (the plan's "Human and Claude contributions"): the counts are
# generated from the project's records (chapters/contributions.py), at the
# end of the day of the volume's latest language pin.
contributions:
  - heading: People and Claude
    slot: contributions
    who: Jeff Good and Adam Tallman
    says: >-
      Who made the linguistic judgements (the diagnostics, the annotation,
      every decision, every promotion of a span rule's status: Jeff Good
      and Adam Tallman) and what Claude did (most of the tooling, under
      written rules, directed and reviewed by Jeff Good). Say that a commit
      made in a Claude session is not a share of authorship. The table
      after this text is written by the build; cite its counts by name.
    fragments: [contribution_table]
  - heading: How Claude's work was kept under control
    slot: controls
    who: Jeff Good and Adam Tallman
    says: >-
      The written rules Claude works under (CLAUDE.md in planars): only a
      coordinator promotes a class's status; Claude asks before writing to
      Drive or GitHub and before any linguistic call; every comment it posts
      is signed; answers it drafted are marked in their Source and released
      marked. Say where the counts above are read from (the repository's
      history and its GitHub issues, which the Zenodo software record does
      not hold).

# The status and limits: what is reviewed and what is not.
status:
  - heading: The diagnostic classes
    slot: classes
    who: Jeff Good and Adam Tallman
    says: >-
      How far each class's span rule and criteria have been reviewed (the
      table after this text, from schemas/diagnostic_classes_status.yaml),
      and what "derived automatically" and "needs review" mean for the
      spans reported here. The span-rule review with the domain expert is
      planars issue #321.
    fragments: [class_status]
  - heading: Open questions in the data
    slot: open_questions
    who: Jeff Good and Adam Tallman
    says: >-
      What is unsettled in the annotation and how it bears on the results:
      English's word, which the word hypothesis needs (#335); the open data
      questions (#314, #298); the answers still marked as Claude drafts.

next:
  - slot: next
    who: Jeff Good and Adam Tallman
    says: >-
      What comes next: the languages to be added (Chichewa is planned), the
      reviews still to do, and what the next report will cover.

# The method chapter (the progress report; docs/zenodo-report-plan.md, "The
# method section"): how the work is done, the software design as well as
# the linguistics. Prose only; each slot names the documents in planars it
# draws on, so the text states what they say rather than recollection.
method:
  - heading: Framework and diagnostics
    slot: framework
    who: Jeff Good and Adam Tallman
    says: >-
      The hypotheses, the terms, and how each class's criteria and span
      rule are set; what extends Tallman, Auderset and Uchihara (2024)
      (strict and loose spans, partial and complete positions, the named
      *-combines criteria), marked as such. Draw on schemas/terms.yaml,
      schemas/diagnostic_classes.yaml, the codebook and docs/analyses.md.
  - heading: Annotation by language experts who do not program
    slot: annotation
    who: Jeff Good and Adam Tallman
    says: >-
      How an annotator works with only a browser and a spreadsheet; the
      GitHub issue as the instruction for each situation; the daily
      pipeline, so nobody has to remember a sequence of steps; annotators'
      proposals reviewed by issue. Draw on CLAUDE.md ("Who the tooling is
      for"), docs/collaborator-guide.md, docs/tooling-design.md and
      docs/coordinator-guide.md.
  - heading: Principles of the research software
    slot: principles
    who: Jeff Good and Adam Tallman
    says: >-
      One owner for every fact, and the failures that taught it; aggregate
      late and never store derived values in the annotation; definition
      files apart from data files; explicit, not implicit (refuse what
      cannot be placed); light maintenance (regenerate, never keep a copy
      by hand). Draw on docs/data-layer-design.md, docs/data-management.md,
      docs/hidden-facts-inventory.md and CLAUDE.md ("Working rules",
      "Design rules").
  - heading: Provenance as the schemas change
    slot: provenance
    who: Jeff Good and Adam Tallman
    says: >-
      The schemas as outputs of the research; change logs with typed change
      classes; a version stamp on every result; chapters pinned to a data
      position; checked claims; the schema- and ontology-evolution
      literature. Draw on docs/change-log-design.md,
      docs/result-stamp-design.md, docs/plain-record-design.md,
      schemas/changes.tsv and docs/references.md.
  - heading: Safeguards on the data
    slot: safeguards
    who: Jeff Good and Adam Tallman
    says: >-
      The doors every write to Drive and to the data passes through; the
      unlogged-source, integrity and codebook checks; issues the pipeline
      files itself; the frozen test copy of Drive. Draw on
      docs/drive-door-design.md, docs/ownership-design.md,
      data_dependency_schema/SCHEMA.md and docs/testing.md.
  - heading: Analysis methods
    slot: analysis_methods
    who: Jeff Good and Adam Tallman
    says: >-
      Laminar families and forests; the permutation tests; domain support
      and the resolution profile, with the phylogenetics methods they
      borrow. Draw on laminar/INDEX.md, the modules' docstrings,
      NonCollaborative/REFERENCES.md and docs/laminar-analysis-plan.md.
  - heading: Reproducibility
    slot: reproducibility
    who: Jeff Good and Adam Tallman
    says: >-
      How every number here can be rebuilt from the dataset and software
      records on Zenodo alone, and the check that does it. Draw on
      docs/zenodo-report-plan.md (item 6) and coding/export_release.py.

intro:
  - heading: The question
    slot: argument
    who: Jeff Good and Adam Tallman
    says: >-
      The question, the three hypotheses (tree, morphosyntax/phonology
      divide, word), and how the volume tests them.
  - heading: Terms
    slot: terms
    who: Jeff Good and Adam Tallman
    says: >-
      How the terms below extend those of Tallman, Auderset and Uchihara
      (2024); the definitions follow this text and are written by the build.
    fragments: [terms]
  - classes: true
    class_fragments: [class]
    who: Jeff Good and Adam Tallman
    says: >-
      What the diagnostic tests and how it relates to the tests in the
      literature; its criteria and span rule follow this text and are
      written by the build.
